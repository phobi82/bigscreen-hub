			async function flushYoutubePlaylistMetadataBatch() {
				youtubePlaylistBatchScheduled = false;
				const batch = [...youtubePlaylistMetadataBatch.entries()].slice(0, 50);
				for (const [playlistId] of batch) youtubePlaylistMetadataBatch.delete(playlistId);
				if (youtubePlaylistMetadataBatch.size) {
					youtubePlaylistBatchScheduled = true;
					queueMicrotask(flushYoutubePlaylistMetadataBatch);
				}
				try {
					const key = await getYoutubeSearchApiKey();
					const url = new URL(YOUTUBE_PLAYLISTS_API_URL);
					url.searchParams.set("part", "snippet");
					url.searchParams.set("id", batch.map(([playlistId]) => playlistId).join(","));
					url.searchParams.set("key", key);
					const response = await fetch(url);
					const data = await response.json().catch(() => null);
					if (!response.ok || data?.error) throw new Error(data?.error?.message || "Playlist metadata unavailable.");
					const items = new Map((Array.isArray(data?.items) ? data.items : []).map(item => [item.id, item.snippet]));
					for (const [playlistId, handlers] of batch) {
						const snippet = items.get(playlistId);
						if (!snippet?.title) handlers.reject(new Error("Playlist metadata unavailable."));
						else handlers.resolve({title: snippet.title, channelTitle: snippet.channelTitle || "", thumbnailUrl: snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url || "", publishedAt: snippet.publishedAt || "", description: snippet.description || ""});
					}
				} catch (error) {
					for (const [, handlers] of batch) handlers.reject(error);
				}
			}

			function resolveYoutubeEntryMetadata(content) {
				const key = content.kind + ":" + (content.kind === "video" ? content.videoId : content.playlistId);
				if (!youtubeMetadataPromises.has(key)) youtubeMetadataPromises.set(key, content.kind === "video" ? loadYoutubeOembedMetadata(content) : queueYoutubePlaylistMetadata(content.playlistId));
				return youtubeMetadataPromises.get(key);
			}

			async function enrichVisibleYoutubeEntry(source, entryId) {
				const entries = source === "queue" ? youtubeState.queue : source === "personal" ? youtubePersonalPlaylist : [];
				const entry = entries.find(candidate => candidate.id === entryId);
				if (!entry || entry.title || youtubePendingMetadataEntryIds.has(entry.id)) return;
				youtubePendingMetadataEntryIds.add(entry.id);
				try {
					const metadata = await resolveYoutubeEntryMetadata(entry.content);
					const currentEntries = source === "queue" ? youtubeState.queue : youtubePersonalPlaylist;
					const current = currentEntries.find(candidate => candidate.id === entryId);
					if (!current || current.title || !applyYoutubeEntryMetadata(current, metadata)) return;
					if (source === "personal") saveYoutubePersonalPlaylist(youtubePersonalPlaylist.map(candidate => cloneYoutubeEntry(candidate)));
					else renderYoutubeLibrary();
				} catch {
					// Keep the stable ID fallback when metadata is unavailable.
				} finally {
					youtubePendingMetadataEntryIds.delete(entryId);
				}
			}

			function createYoutubeActionButton(label, action, disabled = false, title = "") {
				const button = document.createElement("button");
				button.type = "button";
				button.textContent = label;
				button.className = "youtube-dialog-button";
				button.disabled = disabled;
				button.title = title;
				button.addEventListener("click", action);
				return button;
			}

			function hideYoutubeCopyHint() {
				youtubeCopyTargetColumn?.classList.remove("copy-target");
				youtubeCopyTargetColumn = null;
				youtubeCopyHint.hidden = true;
			}

			function showYoutubeCopyHint(button, target) {
				hideYoutubeCopyHint();
				const panel = [youtubeSearchPanel, youtubeQueuePanel, youtubePersonalPanel].find(candidate => !candidate.hidden);
				const targetColumn = panel?.querySelector('[data-youtube-column="' + target + '"]');
				if (!targetColumn) return;
				youtubeCopyTargetColumn = targetColumn;
				targetColumn.classList.add("copy-target");
				if (matchMedia("(max-width: 800px)").matches) return;
				const dialogRect = youtubeSearchDialog.getBoundingClientRect();
				const buttonRect = button.getBoundingClientRect();
				const targetRect = targetColumn.getBoundingClientRect();
				const right = targetRect.left >= buttonRect.right;
				const start = right ? buttonRect.right : buttonRect.left;
				const end = right ? targetRect.left : targetRect.right;
				youtubeCopyHint.className = "youtube-copy-hint " + (right ? "right" : "left");
				youtubeCopyHint.style.left = Math.min(start, end) - dialogRect.left + "px";
				youtubeCopyHint.style.top = buttonRect.top + buttonRect.height / 2 - dialogRect.top + "px";
				youtubeCopyHint.style.width = Math.abs(end - start) + "px";
				youtubeCopyHint.hidden = false;
			}

			function createYoutubeTransferButton(label, target, action, disabled, title) {
				const button = document.createElement("button");
				button.type = "button";
				button.textContent = label;
				button.className = "youtube-transfer-button";
				button.disabled = disabled;
				button.title = title;
				button.ariaLabel = title;
				button.addEventListener("click", () => { hideYoutubeCopyHint(); action(); });
				button.addEventListener("pointerenter", () => showYoutubeCopyHint(button, target));
				button.addEventListener("pointerleave", hideYoutubeCopyHint);
				button.addEventListener("focus", () => showYoutubeCopyHint(button, target));
				button.addEventListener("blur", hideYoutubeCopyHint);
				return button;
			}

			function youtubeEntryLabel(entry) {
				return entry.title || (entry.content.kind === "playlist" ? entry.content.playlistId : entry.content.videoId);
			}

			function createYoutubeEntryCard(entry, source, index, compact = false) {
				const card = document.createElement("article");
				const transferLeft = source === "personal";
				card.className = "youtube-entry-card" + (compact ? " compact" : "") + (transferLeft ? " transfer-left" : "");
				card.dataset.youtubeSource = source;
				card.dataset.youtubeEntryId = entry.id;
				let thumbnail;
				if (entry.thumbnailUrl) {
					thumbnail = document.createElement("img");
					thumbnail.src = entry.thumbnailUrl;
					thumbnail.alt = "";
					thumbnail.loading = "lazy";
				} else {
					thumbnail = document.createElement("span");
					thumbnail.textContent = entry.content.kind === "playlist" ? "Playlist" : "Video";
					thumbnail.style.display = "grid";
					thumbnail.style.placeItems = "center";
					thumbnail.style.color = colors.muted;
					thumbnail.style.fontSize = ".7rem";
				}
				thumbnail.className = "youtube-entry-thumbnail";

				const details = document.createElement("div");
				details.className = "youtube-entry-details";
				const title = document.createElement("strong");
				title.className = "youtube-entry-title";
				title.textContent = youtubeEntryLabel(entry);
				const metadata = document.createElement("span");
				metadata.className = "youtube-entry-meta";
				const type = entry.content.kind === "playlist" ? "Playlist" : "Video";
				const queueStatus = source !== "queue" ? "" : index === youtubeState.queueIndex - 1 && youtubeContentKey(entry.content) === youtubeContentKey(youtubeState.content) ? "Now playing" : index < youtubeState.queueIndex ? "Played" : "Up next";
				metadata.textContent = [queueStatus, type, entry.channelTitle, entry.publishedAt ? new Date(entry.publishedAt).toLocaleDateString() : ""].filter(Boolean).join(" · ") || type;
				details.append(title, metadata);
				if (!entry.title) {
					const id = document.createElement("span");
					id.className = "youtube-entry-meta";
					id.textContent = youtubePendingMetadataEntryIds.has(entry.id) ? "Loading title…" : "Metadata unavailable";
					details.appendChild(id);
				}
				if (!compact && entry.description) {
					const description = document.createElement("span");
					description.className = "youtube-entry-description";
					description.textContent = entry.description;
					details.appendChild(description);
				}

				const actions = document.createElement("div");
				actions.className = "youtube-entry-actions";
				const pending = youtubePendingMetadataEntryIds.has(entry.id);
				const transfer = document.createElement("div");
				transfer.className = "youtube-entry-transfer";
				if (source === "search") {
					actions.appendChild(createYoutubeActionButton("Play now", () => { closeYoutubeSearch(); loadYoutubeContent(entry.content); }));
					transfer.append(
						createYoutubeTransferButton(">>", "queue", () => requestYoutubeQueueMutation({type: "add", entry: cloneYoutubeEntry(entry, true)}), pending || !canAddYoutubeQueue(), "Copy to room queue"),
						createYoutubeTransferButton(">>>", "personal", () => addYoutubePersonalEntry(entry), pending || youtubePersonalPlaylist.length >= YOUTUBE_PERSONAL_MAX_ENTRIES, "Copy to personal playlist")
					);
				} else if (source === "queue") {
					transfer.appendChild(createYoutubeTransferButton(">>", "personal", () => addYoutubePersonalEntry(entry), pending || youtubePersonalPlaylist.length >= YOUTUBE_PERSONAL_MAX_ENTRIES, "Copy to personal playlist"));
					if (!compact) actions.append(
						createYoutubeActionButton("Play now", () => requestYoutubeQueueMutation({type: "play", id: entry.id}), !canEditYoutubeQueue()),
						createYoutubeActionButton("↑", () => requestYoutubeQueueMutation({type: "move", id: entry.id, offset: -1}), !canEditYoutubeQueue() || index <= youtubeState.queueIndex, "Move up"),
						createYoutubeActionButton("↓", () => requestYoutubeQueueMutation({type: "move", id: entry.id, offset: 1}), !canEditYoutubeQueue() || index < youtubeState.queueIndex || index === youtubeState.queue.length - 1, "Move down"),
						createYoutubeActionButton("Remove", () => requestYoutubeQueueMutation({type: "remove", id: entry.id}), !canEditYoutubeQueue())
					);
				} else {
					transfer.appendChild(createYoutubeTransferButton("<<", "queue", () => requestYoutubeQueueMutation({type: "add", entry: cloneYoutubeEntry(entry, true)}), pending || !canAddYoutubeQueue(), "Copy to room queue"));
					if (!compact) actions.append(
						createYoutubeActionButton("Play now", () => loadYoutubeContent(entry.content)),
						createYoutubeActionButton("↑", () => moveYoutubePersonalEntry(index, -1), index === 0, "Move up"),
						createYoutubeActionButton("↓", () => moveYoutubePersonalEntry(index, 1), index === youtubePersonalPlaylist.length - 1, "Move down"),
						createYoutubeActionButton("Remove", () => removeYoutubePersonalEntry(index))
					);
				}
				if (!compact && actions.childElementCount) details.appendChild(actions);
				if (transferLeft) card.append(transfer, thumbnail, details);
				else card.append(thumbnail, details, transfer);
				if (!entry.title && source !== "search" && youtubeMetadataObserver) youtubeMetadataObserver.observe(card);
				return card;
			}

			function clearYoutubeEntryList(target) {
				if (youtubeMetadataObserver) for (const card of target.querySelectorAll(".youtube-entry-card")) youtubeMetadataObserver.unobserve(card);
				target.replaceChildren();
			}

			function renderYoutubeList(target, entries, source, compact) {
				clearYoutubeEntryList(target);
				if (!entries.length) {
					const empty = document.createElement("small");
					empty.textContent = source === "queue" ? "Queue is empty." : "Personal playlist is empty.";
					empty.style.color = colors.muted;
					return target.appendChild(empty);
				}
				entries.forEach((entry, index) => target.appendChild(createYoutubeEntryCard(entry, source, index, compact)));
			}

			function renderYoutubeLibrary() {
				hideYoutubeCopyHint();
				const tabs = {search: youtubeSearchTab, queue: youtubeQueueTab, personal: youtubePersonalTab};
				const panels = {search: youtubeSearchPanel, queue: youtubeQueuePanel, personal: youtubePersonalPanel};
				youtubeQueueTab.textContent = "Room Queue · " + youtubeState.queue.length;
				youtubePersonalTab.textContent = "Personal Playlist · " + youtubePersonalPlaylist.length;
				for (const [name, tab] of Object.entries(tabs)) {
					const active = name === youtubeLibraryTab;
					tab.setAttribute("aria-selected", String(active));
					tab.tabIndex = active ? 0 : -1;
					panels[name].hidden = !active;
				}
				const queueHeading = "Room Queue · " + youtubeState.queueIndex + " played · " + (youtubeState.queue.length - youtubeState.queueIndex) + " upcoming";
				if (youtubeLibraryTab === "search") {
					clearYoutubeEntryList(youtubeSearchResults);
					youtubeSearchResults.append(...youtubeSearchEntries.map((entry, index) => createYoutubeEntryCard(entry, "search", index)));
					youtubeSearchQueueColumn.heading.textContent = "Room Queue · " + youtubeState.queue.length;
					youtubeSearchPersonalColumn.heading.textContent = "Personal · " + youtubePersonalPlaylist.length;
					renderYoutubeList(youtubeSearchQueueColumn.list, youtubeState.queue, "queue", true);
					renderYoutubeList(youtubeSearchPersonalColumn.list, youtubePersonalPlaylist, "personal", true);
				} else if (youtubeLibraryTab === "queue") {
					youtubeQueueColumn.heading.textContent = queueHeading;
					youtubeQueuePersonalColumn.heading.textContent = "Personal Playlist";
					renderYoutubeList(youtubeQueueColumn.list, youtubeState.queue, "queue", false);
					renderYoutubeList(youtubeQueuePersonalColumn.list, youtubePersonalPlaylist, "personal", true);
				} else {
					youtubePersonalQueueColumn.heading.textContent = "Room Queue · " + youtubeState.queue.length;
					youtubePersonalColumn.heading.textContent = "Personal Playlist";
					renderYoutubeList(youtubePersonalQueueColumn.list, youtubeState.queue, "queue", true);
					renderYoutubeList(youtubePersonalColumn.list, youtubePersonalPlaylist, "personal", false);
				}
			}

			function setYoutubeTab(tab, focus = false) {
				if (!["search", "queue", "personal"].includes(tab)) return;
				youtubeLibraryTab = tab;
				hideYoutubeCopyHint();
				renderYoutubeLibrary();
				if (focus) ({search: youtubeSearchTab, queue: youtubeQueueTab, personal: youtubePersonalTab})[tab].focus();
			}

			function showYoutubeDialog(tab) {
				youtubeSearchTitle.textContent = "YouTube";
				youtubeSearchOverlay.hidden = false;
				youtubeSearchOverlay.style.display = "flex";
				setYoutubeTab(tab);
			}

			function closeYoutubeSearch() {
				youtubeSearchController?.abort();
				youtubeSearchController = null;
				youtubeSearchButton.disabled = false;
				youtubeSearchOverlay.hidden = true;
				youtubeSearchOverlay.style.display = "none";
				hideYoutubeCopyHint();
				youtubeInput.focus();
			}

			function openYoutubeSearch(query) {
				showYoutubeDialog("search");
				youtubeSearchInput.value = query;
				youtubeSearchInput.focus();
				searchYoutube(query);
			}

			function openYoutubeUrl(content, value = "") {
				showYoutubeDialog("search");
				if (value) youtubeSearchInput.value = value;
				const entry = createYoutubeEntry(content);
				youtubeSearchEntries = [entry];
				youtubePendingMetadataEntryIds.add(entry.id);
				setYoutubeSearchStatus("Loading title…");
				renderYoutubeLibrary();
				resolveYoutubeEntryMetadata(content).then(metadata => {
					const current = youtubeSearchEntries.find(candidate => candidate.id === entry.id);
					if (current && applyYoutubeEntryMetadata(current, metadata)) setYoutubeSearchStatus("URL ready.");
				}).catch(() => {
					if (youtubeSearchEntries.some(candidate => candidate.id === entry.id)) setYoutubeSearchStatus("Title unavailable. The content ID will be used.", true);
				}).finally(() => {
					youtubePendingMetadataEntryIds.delete(entry.id);
					if (youtubeLibraryTab === "search") renderYoutubeLibrary();
				});
			}

			function openYoutubeLibrary(tab = "queue") {
				showYoutubeDialog(tab);
			}

			function renderYoutubeSearchResults(items) {
				clearYoutubeEntryList(youtubeSearchResults);
				youtubeSearchEntries = [];
				let resultCount = 0;
				for (const item of items) {
					const videoId = item.id?.videoId || "";
					const playlistId = item.id?.playlistId || "";
					const content = YOUTUBE_VIDEO_ID_PATTERN.test(videoId) ? {kind: "video", videoId, playlistId: "", index: 0} : YOUTUBE_PLAYLIST_ID_PATTERN.test(playlistId) ? {kind: "playlist", videoId: "", playlistId, index: 0} : null;
					if (!content) continue;
					const entry = createYoutubeEntry(content, {
						title: decodeYoutubeText(item.snippet?.title || ""),
						channelTitle: decodeYoutubeText(item.snippet?.channelTitle || ""),
						thumbnailUrl: item.snippet?.thumbnails?.medium?.url || item.snippet?.thumbnails?.default?.url || "",
						publishedAt: item.snippet?.publishedAt || item.snippet?.publishTime || "",
						description: decodeYoutubeText(item.snippet?.description || "")
					});
					youtubeSearchEntries.push(entry);
					youtubeSearchResults.appendChild(createYoutubeEntryCard(entry, "search", resultCount));
					resultCount++;
				}
				return resultCount;
			}

			async function searchYoutube(query) {
				const normalizedQuery = query.trim();
				if (!normalizedQuery) return setYoutubeSearchStatus("Enter a search term.", true);
				setYoutubeTab("search");
				const searchKey = youtubeSearchType.value + ":" + normalizedQuery;
				if (youtubeSearchController && searchKey === youtubeSearchQuery) return;
				youtubeSearchController?.abort();
				const controller = new AbortController();
				youtubeSearchController = controller;
				youtubeSearchQuery = searchKey;
				youtubeSearchButton.disabled = true;
				setYoutubeSearchStatus("Searching…");
				try {
					const key = await getYoutubeSearchApiKey();
					const url = new URL(YOUTUBE_SEARCH_API_URL);
					url.searchParams.set("part", "snippet");
					url.searchParams.set("type", youtubeSearchType.value);
					if (youtubeSearchType.value === "video") {
						url.searchParams.set("videoEmbeddable", "true");
						url.searchParams.set("videoSyndicated", "true");
					}
					url.searchParams.set("maxResults", String(YOUTUBE_SEARCH_MAX_RESULTS));
					url.searchParams.set("q", normalizedQuery);
					url.searchParams.set("key", key);
					let response;
					try {
						response = await fetch(url, {signal: controller.signal});
					} catch (error) {
						if (error?.name === "AbortError") return;
						throw new Error("Could not reach YouTube. Check the network connection.");
					}
					let data = null;
					try {
						data = await response.json();
					} catch {}
					if (!response.ok || data?.error) {
						const reason = data?.error?.errors?.[0]?.reason || "";
						if (reason === "quotaExceeded" || reason === "dailyLimitExceeded") throw new Error("The YouTube search quota has been exceeded.");
						throw new Error(data?.error?.message || "YouTube search failed with HTTP " + response.status + ".");
					}
					const items = Array.isArray(data?.items) ? data.items : [];
					const resultCount = renderYoutubeSearchResults(items);
					setYoutubeSearchStatus(resultCount ? resultCount + " result" + (resultCount === 1 ? "" : "s") + "." : "No " + youtubeSearchType.value + "s found.");
				} catch (error) {
					if (error?.name !== "AbortError") setYoutubeSearchStatus(error instanceof Error ? error.message : "YouTube search failed.", true);
				} finally {
					if (youtubeSearchController === controller) {
						youtubeSearchController = null;
						youtubeSearchButton.disabled = false;
					}
				}
			}

			function youtubeContentKey(content) {
				return content ? [content.kind, content.videoId, content.playlistId, content.index].join(":") : "";
			}

			function isYoutubeMaster() {
				return youtubeState.master?.peerId === selfId;
			}

			function canPublishYoutubeControls() {
				return youtubeSynced && (!youtubeState.master || isYoutubeMaster());
			}

			function canRequestYoutubeControls() {
				return youtubeSynced && Boolean(youtubeState.master?.sharedControl) && !isYoutubeMaster();
			}

			function isYoutubeActorFromPeer(actor, peerId) {
				if (!isValidActor(actor) || !peerId) return false;
				const participant = [...participants.values()].find(candidate => candidate.peerId === peerId);
				return !participant || participant.userId === actor.userId;
			}

			function canEditYoutubeQueue() {
				return roomReady && youtubeSynced && (!youtubeState.master || isYoutubeMaster() || youtubeState.master.sharedControl);
			}

			function canAddYoutubeQueue() {
				return roomReady && (canEditYoutubeQueue() || Boolean(youtubeState.master?.allowAdding));
			}

			function youtubeQueueAuthorityPeerId() {
				return youtubeState.master?.peerId || youtubeState.clockPeerId || selfId;
			}

			function isValidYoutubeQueueMutation(mutation) {
				if (!mutation || typeof mutation.type !== "string") return false;
				if (mutation.type === "add") return isValidYoutubeEntry(mutation.entry);
				if (mutation.type === "move") return YOUTUBE_ENTRY_ID_PATTERN.test(mutation.id || "") && (mutation.offset === -1 || mutation.offset === 1);
				if (mutation.type === "remove" || mutation.type === "play") return YOUTUBE_ENTRY_ID_PATTERN.test(mutation.id || "");
				return mutation.type === "advance" && typeof mutation.expectedContentKey === "string" && mutation.expectedContentKey.length <= 300;
			}

			function applyYoutubeQueueMutation(mutation) {
				if (!isValidYoutubeQueueMutation(mutation)) return false;
				const queue = youtubeState.queue.map(entry => cloneYoutubeEntry(entry));
				let queueIndex = youtubeState.queueIndex;
				let content = cloneYoutubeContent(youtubeState.content);
				let playback = currentSharedYoutubePlayback();
				if (mutation.type === "add") {
					if (queue.length >= YOUTUBE_QUEUE_MAX_ENTRIES) {
						const currentQueueEntry = queueIndex > 0 && youtubeContentKey(queue[queueIndex - 1].content) === youtubeContentKey(youtubeState.content);
						if (queueIndex === 0 || (queueIndex === 1 && currentQueueEntry)) return false;
						queue.shift();
						queueIndex--;
					}
					queue.push(cloneYoutubeEntry(mutation.entry));
				} else if (mutation.type === "advance") {
					if (queueIndex >= queue.length || mutation.expectedContentKey !== youtubeContentKey(youtubeState.content)) return false;
					content = cloneYoutubeContent(queue[queueIndex++].content);
					playback = {status: "playing", position: 0, rate: 1};
				} else {
					const index = queue.findIndex(entry => entry.id === mutation.id);
					if (index < 0) return false;
					if (mutation.type === "remove") {
						queue.splice(index, 1);
						if (index < queueIndex) queueIndex--;
					}
					else if (mutation.type === "play") {
						content = cloneYoutubeContent(queue[index].content);
						queueIndex = index + 1;
						playback = {status: "playing", position: 0, rate: 1};
					} else {
						const target = index + mutation.offset;
						if (index < queueIndex || target < queueIndex || target >= queue.length) return false;
						[queue[index], queue[target]] = [queue[target], queue[index]];
					}
				}
				const changesPlayback = mutation.type === "play" || mutation.type === "advance";
				if (changesPlayback && youtubeSynced) applyYoutubeSnapshot(content, playback);
				publishYoutubeState(content, playback, youtubeState.master, queue, queueIndex, changesPlayback && youtubeSynced, !changesPlayback);
				return true;
			}

			function requestYoutubeQueueMutation(mutation) {
				if (!isValidYoutubeQueueMutation(mutation)) return;
				const allowed = mutation.type === "add" ? canAddYoutubeQueue() : mutation.type === "advance" ? youtubeSynced : canEditYoutubeQueue();
				if (!allowed) return setNotice("Room queue action is not allowed.", true);
				const authority = youtubeQueueAuthorityPeerId();
				if (authority === selfId) {
					if (!applyYoutubeQueueMutation(mutation)) setNotice(mutation.type === "add" ? "Room queue limit reached." : "Room queue action failed.", true);
					return;
				}
				connection?.sendYouTube({kind: "queueMutation", actor: currentActor(), mutation}, [authority]).catch(error => setNotice("Room queue request failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function submitYoutubeSnapshot(snapshot) {
				if (canPublishYoutubeControls()) {
					publishYoutubeState(snapshot.content, snapshot.playback, youtubeState.master);
					return true;
				}
				if (!canRequestYoutubeControls()) return false;
				connection?.sendYouTube({kind: "control", actor: currentActor(), content: cloneYoutubeContent(snapshot.content), playback: cloneYoutubePlayback(snapshot.playback)}, [youtubeState.master.peerId]).catch(error => setNotice("YouTube control request failed: " + (error instanceof Error ? error.message : String(error)), true));
				return true;
			}

			function loadYoutubeContent(content) {
				const playback = {status: "playing", position: 0, rate: 1};
				applyYoutubeSnapshot(content, playback);
				if (!submitYoutubeSnapshot({content, playback})) {
					youtubeSynced = false;
					youtubePlayerError = "";
					renderYoutubeControls();
				}
			}

			function currentSharedYoutubePlayback() {
				const playback = cloneYoutubePlayback(youtubeState.playback);
				if (playback.status === "playing") playback.position += Math.max(0, performance.now() - youtubeStateReceivedAt) / 1000 * playback.rate;
				return playback;
			}

			function isStaleYoutubePlayback(playback) {
				const shared = currentSharedYoutubePlayback();
				return youtubeSynced && shared.status === "playing" && playback.status !== "playing" && playback.position + YOUTUBE_DRIFT_SECONDS < shared.position;
			}

			function youtubeStatusFromPlayer(value) {
				if (value === 1) return "playing";
				if (value === 0) return "ended";
				return "paused";
			}

			function handleYoutubePageActivity() {
				const inactive = document.hidden || !document.hasFocus();
				if (inactive) {
					youtubePageInactive = true;
					return;
				}
				if (!youtubePageInactive) return;
				youtubePageInactive = false;
				if (youtubeSynced && youtubeState.playback.status === "playing") applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
			}

			function readLocalYoutubeSnapshot() {
				let content = cloneYoutubeContent(localYoutubeContent);
				const playback = cloneYoutubePlayback(localYoutubePlayback);
				if (!youtubePlayerReady || !youtubePlayer) return {content, playback};
				const videoId = youtubePlayer.getVideoData?.()?.video_id || "";
				if (content && YOUTUBE_VIDEO_ID_PATTERN.test(videoId)) {
					content.videoId = videoId;
					if (content.kind === "playlist") {
						const index = youtubePlayer.getPlaylistIndex?.();
						if (Number.isSafeInteger(index) && index >= 0) content.index = index;
					}
				}
				const position = youtubePlayer.getCurrentTime?.();
				const rate = youtubePlayer.getPlaybackRate?.();
				playback.status = youtubeStatusFromPlayer(youtubePlayer.getPlayerState?.());
				if (Number.isFinite(position) && position >= 0) playback.position = position;
				if (Number.isFinite(rate) && rate >= .25 && rate <= 2) playback.rate = rate;
				localYoutubeContent = cloneYoutubeContent(content);
				localYoutubePlayback = cloneYoutubePlayback(playback);
				return {content, playback};
			}

			function createYoutubePlayer() {
				if (youtubePlayer || !window.YT?.Player) return;
				youtubePlayer = new window.YT.Player("youtube-player", {
					width: "100%",
					height: "100%",
					playerVars: {playsinline: 1, origin: location.origin},
					events: {
						onReady: () => {
							youtubePlayerReady = true;
							youtubePlayerError = "";
							if (youtubeSynced) applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
							else applyYoutubeSnapshot(localYoutubeContent, localYoutubePlayback);
							if (!youtubeMonitor) youtubeMonitor = window.setInterval(monitorYoutubePlayer, YOUTUBE_MONITOR_MS);
							renderYoutubeControls();
						},
						onStateChange: handleYoutubePlayerState,
						onPlaybackRateChange: handleYoutubePlaybackRate,
						onAutoplayBlocked: () => {
							if (youtubeSynced && youtubeState.playback.status === "playing") {
								youtubePlayerError = "Playback requires a click to resume.";
								renderYoutubeControls();
								return;
							}
							if (youtubeState.version.peerId === selfId && canPublishYoutubeControls()) {
								const snapshot = readLocalYoutubeSnapshot();
								snapshot.playback.status = "paused";
								publishYoutubeState(snapshot.content, snapshot.playback, youtubeState.master);
							} else youtubeSynced = false;
							youtubePlayerError = "Playback requires a click.";
							renderYoutubeControls();
						},
						onError: event => {
							const errors = {
								2: "Invalid YouTube video.",
								5: "YouTube HTML5 playback failed.",
								100: "YouTube video not found or private.",
								101: "YouTube blocked embedded playback on this device.",
								150: "YouTube blocked embedded playback on this device.",
								153: "YouTube rejected the player client identity."
							};
							youtubePlayerError = errors[event.data] || "YouTube player error " + event.data + ".";
							renderYoutubeControls();
						}
					}
				});
			}

			function ensureYoutubePlayer() {
				if (youtubePlayer || youtubeApiRequested) return;
				youtubeApiRequested = true;
				window.onYouTubeIframeAPIReady = createYoutubePlayer;
				if (window.YT?.Player) return createYoutubePlayer();
				const script = document.createElement("script");
				script.src = YOUTUBE_API_URL;
				script.addEventListener("error", () => {
					youtubePlayerError = "YouTube API failed to load.";
					renderYoutubeControls();
				});
				document.head.appendChild(script);
			}

			function applyYoutubeSnapshot(content, playback) {
				const previousKey = youtubeContentKey(localYoutubeContent);
				localYoutubeContent = cloneYoutubeContent(content);
				localYoutubePlayback = cloneYoutubePlayback(playback);
				youtubeLastSample = null;
				if (!youtubePlayerReady || !youtubePlayer) return;
				youtubeRemoteGuardUntil = performance.now() + YOUTUBE_REMOTE_GUARD_MS;
				youtubePlayerError = "";
				if (!content) {
					youtubePlayer.stopVideo?.();
					return;
				}
				const playerVideoId = youtubePlayer.getVideoData?.()?.video_id || "";
				const playerHasContent = content.kind === "video" ? playerVideoId === content.videoId : Boolean(youtubePlayer.getPlaylist?.()?.length);
				const changed = previousKey !== youtubeContentKey(content) || !playerHasContent;
				if (changed && content.kind === "playlist") {
					const options = {list: content.playlistId, listType: "playlist", index: content.index, startSeconds: playback.position};
					if (playback.status === "playing") youtubePlayer.loadPlaylist(options);
					else youtubePlayer.cuePlaylist(options);
				} else if (changed) {
					const options = {videoId: content.videoId, startSeconds: playback.position};
					if (playback.status === "playing") youtubePlayer.loadVideoById(options);
					else youtubePlayer.cueVideoById(options);
				} else {
					const currentPosition = youtubePlayer.getCurrentTime?.() || 0;
					if (Math.abs(currentPosition - playback.position) > YOUTUBE_DRIFT_SECONDS) youtubePlayer.seekTo(playback.position, true);
					if (playback.status === "playing" && youtubePlayer.getPlayerState?.() !== 1) youtubePlayer.playVideo();
					if (playback.status !== "playing" && youtubePlayer.getPlayerState?.() === 1) youtubePlayer.pauseVideo();
				}
				if (Math.abs((youtubePlayer.getPlaybackRate?.() || 1) - playback.rate) > .01) youtubePlayer.setPlaybackRate?.(playback.rate);
			}

			function synchronizeYoutubePlayback(playback) {
				localYoutubePlayback = cloneYoutubePlayback(playback);
				if (!youtubePlayerReady || !youtubePlayer || !youtubeState.content) return;
				if (youtubeContentKey(localYoutubeContent) !== youtubeContentKey(youtubeState.content)) return applyYoutubeSnapshot(youtubeState.content, playback);
				const playerState = youtubePlayer.getPlayerState?.();
				const position = youtubePlayer.getCurrentTime?.() || 0;
				const needsSeek = Math.abs(position - playback.position) > YOUTUBE_DRIFT_SECONDS;
				const needsPlay = playback.status === "playing" && playerState !== 1;
				const needsPause = playback.status !== "playing" && playerState === 1;
				const needsRate = Math.abs((youtubePlayer.getPlaybackRate?.() || 1) - playback.rate) > .01;
				if (!needsSeek && !needsPlay && !needsPause && !needsRate) return;
				youtubeRemoteGuardUntil = performance.now() + YOUTUBE_REMOTE_GUARD_MS;
				if (needsSeek) youtubePlayer.seekTo(playback.position, true);
				if (needsPlay) youtubePlayer.playVideo();
				if (needsPause) youtubePlayer.pauseVideo();
				if (needsRate) youtubePlayer.setPlaybackRate?.(playback.rate);
				youtubeLastSample = null;
			}

			function renderYoutubeControls() {
				const master = youtubeState.master;
				const selfMaster = isYoutubeMaster();
				if (master) {
					const controller = createParticipantButton(master.actor);
					controller.style.width = "auto";
					controller.style.padding = ".1rem";
					controller.style.borderBottom = "0";
					controller.style.borderRadius = ".45rem";
					youtubeRoleStatus.replaceChildren("Controller:", controller);
				} else youtubeRoleStatus.textContent = "No controller";
				youtubeSyncButton.textContent = youtubeSynced ? "Stop syncing" : "Sync";
				youtubeSyncButton.disabled = !roomReady;
				youtubeSyncButton.title = youtubeSynced ? "Leave room playback and keep local changes private." : "Follow the current room playback.";
				youtubeSyncButton.style.opacity = "1";
				youtubeControlButton.textContent = selfMaster ? "Release control" : "Take control";
				youtubeControlButton.disabled = !roomReady || Boolean(master?.locked && !selfMaster);
				youtubeControlButton.title = master?.locked && !selfMaster ? "The controller locked takeover." : selfMaster ? "Return the room to shared control." : "Use the local playback and take control.";
				youtubeSharedControlButton.hidden = !selfMaster;
				youtubeSharedControlButton.textContent = master?.sharedControl ? "Stop shared control" : "Allow shared control";
				youtubeAllowAddingButton.hidden = !selfMaster;
				youtubeAllowAddingButton.textContent = master?.allowAdding ? "Stop adding" : "Allow adding";
				youtubeAllowAddingButton.setAttribute("aria-pressed", String(Boolean(master?.allowAdding)));
				youtubeLockButton.hidden = !selfMaster;
				youtubeLockButton.textContent = master?.locked ? "🔒" : "🔓";
				youtubeLockButton.ariaLabel = master?.locked ? "Unlock takeover" : "Lock takeover";
				youtubeLockButton.title = youtubeLockButton.ariaLabel;
				youtubeLockButton.setAttribute("aria-pressed", String(Boolean(master?.locked)));
				youtubeInput.disabled = !roomReady;
				youtubeLoadButton.disabled = !roomReady;
				youtubeListsButton.disabled = !roomReady;
				youtubeListsButton.textContent = "Lists · " + youtubeState.queue.length;
				youtubeListsButton.title = youtubeState.queue.length + " queued, " + youtubePersonalPlaylist.length + " saved personally.";
				if (!youtubeSearchOverlay.hidden) renderYoutubeLibrary();
				if (youtubePlayerError) {
					youtubeStatus.textContent = (youtubeSynced ? "Synced" : "Local playback") + " · " + youtubePlayerError;
					youtubeStatus.style.color = colors.warning;
				} else if (!youtubeState.content && !localYoutubeContent) {
					youtubeStatus.textContent = (youtubeSynced ? "Synced" : "Local playback") + " · No video loaded.";
					youtubeStatus.style.color = youtubeSynced ? colors.success : colors.warning;
				} else if (!youtubeSynced) {
					youtubeStatus.textContent = "Local playback · Click Sync to follow the room again.";
					youtubeStatus.style.color = colors.warning;
				} else if (selfMaster) {
					youtubeStatus.textContent = "Synced · " + (master.sharedControl ? "Shared control is allowed. " : "Control is exclusive. ") + (master.locked ? "Takeover is locked." : "Takeover is open.");
					youtubeStatus.style.color = colors.success;
				} else if (!master) {
					youtubeStatus.textContent = "Synced · Shared control. The last action wins.";
					youtubeStatus.style.color = colors.success;
				} else if (master.sharedControl) {
					youtubeStatus.textContent = "Synced · Shared control is allowed by the controller.";
					youtubeStatus.style.color = colors.success;
				} else if (master.allowAdding) {
					youtubeStatus.textContent = "Synced · Following the room controller. Queue adding is allowed.";
					youtubeStatus.style.color = colors.success;
				} else {
					youtubeStatus.textContent = "Synced · Following the room controller.";
					youtubeStatus.style.color = colors.success;
				}
			}

			function sendYoutubeState(state) {
				connection?.sendYouTube({kind: "state", state: cloneYoutubeSharedState(state)}).catch(error => setNotice("YouTube state send failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function publishYoutubeState(content, playback, master, queue = youtubeState.queue, queueIndex = youtubeState.queueIndex, updateLocalPlayback = true, retainClock = false) {
				if (!roomReady || !connection) return;
				youtubeState = {
					content: cloneYoutubeContent(content),
					playback: cloneYoutubePlayback(playback),
					queue: queue.map(entry => cloneYoutubeEntry(entry)),
					queueIndex,
					master: master ? {peerId: master.peerId, actor: {...master.actor}, locked: master.locked, sharedControl: Boolean(master.sharedControl), allowAdding: Boolean(master.allowAdding)} : null,
					clockPeerId: retainClock ? youtubeState.clockPeerId : selfId,
					clockSequence: 0,
					version: {counter: youtubeState.version.counter + 1, peerId: selfId}
				};
				youtubeStateReceivedAt = performance.now();
				if (updateLocalPlayback) {
					youtubeSynced = true;
					youtubePlayerError = "";
					localYoutubeContent = cloneYoutubeContent(content);
					localYoutubePlayback = cloneYoutubePlayback(playback);
				}
				sendYoutubeState(youtubeState);
				renderYoutubeControls();
			}

			function transferYoutubeControl(target) {
				if (!isYoutubeMaster() || !target.peerId || target.peerId === selfId || !isValidActor(target) || isIgnored(target, "youtubeControl")) return;
				const snapshot = readLocalYoutubeSnapshot();
				youtubeState = {
					content: cloneYoutubeContent(snapshot.content),
					playback: currentSharedYoutubePlayback(),
					queue: youtubeState.queue.map(entry => cloneYoutubeEntry(entry)),
					queueIndex: youtubeState.queueIndex,
					master: {peerId: target.peerId, actor: {userId: target.userId, name: target.name, mode: target.mode}, locked: youtubeState.master.locked, sharedControl: youtubeState.master.sharedControl, allowAdding: youtubeState.master.allowAdding},
					clockPeerId: youtubeState.clockPeerId,
					clockSequence: 0,
					version: {counter: youtubeState.version.counter + 1, peerId: selfId}
				};
				youtubeStateReceivedAt = performance.now();
				youtubeSynced = true;
				youtubePlayerError = "";
				localYoutubeContent = cloneYoutubeContent(snapshot.content);
				localYoutubePlayback = cloneYoutubePlayback(currentSharedYoutubePlayback());
				sendYoutubeState(youtubeState);
				renderYoutubeControls();
				setNotice("Control given to " + (target.name || target.userId.slice(0, 8)) + ".");
			}

			function acceptYoutubeState(candidate, senderPeerId = "", fromSnapshot = false) {
				if (!isValidYoutubeState(candidate)) return;
				const newerVersion = isNewerVersion(candidate.version, youtubeState.version);
				const newerSnapshot = fromSnapshot && candidate.version.counter === youtubeState.version.counter && candidate.version.peerId === youtubeState.version.peerId && candidate.clockSequence > youtubeState.clockSequence;
				if (!newerVersion && !newerSnapshot) return;
				const departedClock = Boolean(youtubeState.clockPeerId) && !connection?.getPeerIds().includes(youtubeState.clockPeerId);
				const departedMaster = Boolean(youtubeState.master?.peerId) && !connection?.getPeerIds().includes(youtubeState.master.peerId);
				const isPeerDepartureHandoff = !fromSnapshot && senderPeerId === candidate.version.peerId && (departedClock || departedMaster);
				if (!fromSnapshot && youtubeState.master && senderPeerId !== youtubeState.master.peerId && !isPeerDepartureHandoff) return;
				if (!fromSnapshot && !youtubeState.master && candidate.master && senderPeerId !== candidate.master.peerId && !isPeerDepartureHandoff) return;
				if (!fromSnapshot && !youtubeState.master && !candidate.master && senderPeerId !== candidate.version.peerId && !isPeerDepartureHandoff) return;
				const wasMaster = isYoutubeMaster();
				const incoming = cloneYoutubeState(candidate);
				const cursorId = candidate.queueCursorId || (incoming.queueIndex > 0 ? incoming.queue[incoming.queueIndex - 1].id : "");
				const incomingQueue = incoming.queue.slice(incoming.queueIndex);
				let history = youtubeState.queue.slice(0, youtubeState.queueIndex);
				const cursorIndex = cursorId ? youtubeState.queue.findIndex((entry, index) => index >= youtubeState.queueIndex && entry.id === cursorId) : -1;
				if (cursorIndex >= 0) history.push(...youtubeState.queue.slice(youtubeState.queueIndex, cursorIndex + 1));
				else if (fromSnapshot && incoming.queueIndex > 0) history.push(incoming.queue[incoming.queueIndex - 1]);
				history = history.slice(Math.max(0, history.length - (YOUTUBE_QUEUE_MAX_ENTRIES - incomingQueue.length)));
				youtubeState = {...incoming, queue: [...history, ...incomingQueue], queueIndex: history.length};
				youtubeStateReceivedAt = performance.now();
				youtubePlayerError = "";
				if (youtubeState.master?.peerId === selfId || (wasMaster && youtubeState.master?.peerId !== selfId)) youtubeSynced = true;
				if (youtubeSynced) applyYoutubeSnapshot(youtubeState.content, youtubeState.playback);
				renderYoutubeControls();
			}

			function handleYoutubeMessage(message, senderPeerId) {
				if (!message || typeof message.kind !== "string") return;
				if (message.kind === "state") return acceptYoutubeState(message.state, senderPeerId);
				if (message.kind === "heartbeat") {
					if (senderPeerId !== youtubeState.clockPeerId || !isValidYoutubeContent(message.content) || !isValidYoutubePlayback(message.playback) || message.playback.status !== "playing" || !Number.isSafeInteger(message.clockSequence) || message.clockSequence <= youtubeState.clockSequence || message.version?.counter !== youtubeState.version.counter || message.version?.peerId !== youtubeState.version.peerId || youtubeContentKey(message.content) !== youtubeContentKey(youtubeState.content)) return;
					youtubeState.playback = cloneYoutubePlayback(message.playback);
					youtubeState.clockSequence = message.clockSequence;
					youtubeStateReceivedAt = performance.now();
					if (youtubeSynced) synchronizeYoutubePlayback(youtubeState.playback);
					return;
				}
				if (message.kind === "queueDenied") {
					if (senderPeerId === youtubeQueueAuthorityPeerId()) setNotice("The room queue action was rejected.", true);
					return;
				}
				if (message.kind === "queueMutation") {
					if (youtubeQueueAuthorityPeerId() !== selfId || !isYoutubeActorFromPeer(message.actor, senderPeerId) || !isValidYoutubeQueueMutation(message.mutation)) return;
					const mutation = message.mutation;
					const allowed = !isIgnored(message.actor, "youtubeControl") && (mutation.type === "advance" || !youtubeState.master || youtubeState.master.sharedControl || (mutation.type === "add" && youtubeState.master.allowAdding));
					if (allowed && applyYoutubeQueueMutation(mutation)) return;
					connection?.sendYouTube({kind: "queueDenied"}, [senderPeerId]).catch(error => setNotice("Room queue response failed: " + (error instanceof Error ? error.message : String(error)), true));
					return;
				}
				if (message.kind === "controlDenied") {
					if (senderPeerId !== youtubeState.master?.peerId || !youtubeSynced) return;
					youtubeSynced = false;
					setNotice("The controller rejected this YouTube action.", true);
					renderYoutubeControls();
					return;
				}
				if (message.kind === "takeoverDenied") {
					if (senderPeerId === youtubeState.master?.peerId) setNotice("The controller rejected takeover.", true);
					return;
				}
				if (message.kind === "control") {
					if (!isYoutubeMaster() || !isYoutubeActorFromPeer(message.actor, senderPeerId) || !isValidYoutubeContent(message.content) || !isValidYoutubePlayback(message.playback)) return;
					if (!youtubeState.master.sharedControl || isIgnored(message.actor, "youtubeControl")) {
						connection?.sendYouTube({kind: "controlDenied"}, [senderPeerId]).catch(error => setNotice("YouTube control response failed: " + (error instanceof Error ? error.message : String(error)), true));
						return;
					}
					applyYoutubeSnapshot(message.content, message.playback);
					publishYoutubeState(message.content, message.playback, youtubeState.master);
					return;
				}
				if (message.kind !== "takeover" || !isYoutubeMaster() || !isYoutubeActorFromPeer(message.actor, senderPeerId) || !isValidYoutubeContent(message.content) || !isValidYoutubePlayback(message.playback)) return;
				if (youtubeState.master.locked || isIgnored(message.actor, "youtubeControl")) {
					connection?.sendYouTube({kind: "takeoverDenied"}, [senderPeerId]).catch(error => setNotice("YouTube takeover response failed: " + (error instanceof Error ? error.message : String(error)), true));
					return;
				}
				youtubeState = {
					content: cloneYoutubeContent(message.content),
					playback: cloneYoutubePlayback(message.playback),
					queue: youtubeState.queue.map(entry => cloneYoutubeEntry(entry)),
					queueIndex: youtubeState.queueIndex,
					master: {peerId: senderPeerId, actor: {...message.actor}, locked: false, sharedControl: false, allowAdding: false},
					clockPeerId: senderPeerId,
					clockSequence: 0,
					version: {counter: youtubeState.version.counter + 1, peerId: selfId}
				};
				youtubeStateReceivedAt = performance.now();
				youtubeSynced = true;
				applyYoutubeSnapshot(youtubeState.content, youtubeState.playback);
				sendYoutubeState(youtubeState);
				renderYoutubeControls();
			}

			function handleYoutubePlayerState(event) {
				const status = youtubeStatusFromPlayer(event.data);
				if (event.data === 3 || event.data === -1 || event.data === 5) return;
				if (status === "paused" && performance.now() < youtubeRemoteGuardUntil) return;
				if (status === "paused" && youtubePageInactive && youtubeSynced && youtubeState.playback.status === "playing") {
					applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
					return;
				}
				if (youtubePlayerError && [0, 1, 2, 5].includes(event.data)) {
					youtubePlayerError = "";
					renderYoutubeControls();
				}
				localYoutubePlayback.status = status;
				if (status === "ended" && localYoutubeContent?.kind === "playlist") youtubeNaturalAdvanceUntil = performance.now() + 3000;
				if (performance.now() < youtubeRemoteGuardUntil) return;
				if (status === "ended" && youtubeSynced && youtubeState.queueIndex < youtubeState.queue.length) {
					const playlist = localYoutubeContent?.kind === "playlist" ? youtubePlayer.getPlaylist?.() : null;
					const playlistIndex = localYoutubeContent?.kind === "playlist" ? youtubePlayer.getPlaylistIndex?.() : -1;
					const contentFinished = localYoutubeContent?.kind === "video" || (Array.isArray(playlist) && playlist.length > 0 && playlistIndex === playlist.length - 1);
					if (contentFinished) {
						requestYoutubeQueueMutation({type: "advance", expectedContentKey: youtubeContentKey(youtubeState.content)});
						return;
					}
				}
				const snapshot = readLocalYoutubeSnapshot();
				if (isStaleYoutubePlayback(snapshot.playback)) {
					applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
					return;
				}
				if (!submitYoutubeSnapshot(snapshot) && youtubeSynced && youtubeState.master && status !== youtubeState.playback.status && status !== "ended") {
					youtubeSynced = false;
					renderYoutubeControls();
				}
			}

			function handleYoutubePlaybackRate() {
				if (performance.now() < youtubeRemoteGuardUntil) return;
				const snapshot = readLocalYoutubeSnapshot();
				if (!submitYoutubeSnapshot(snapshot) && youtubeSynced && youtubeState.master) {
					youtubeSynced = false;
					renderYoutubeControls();
				}
			}

			function monitorYoutubePlayer() {
				if (!youtubePlayerReady || !youtubePlayer) return;
				const now = performance.now();
				const playerState = youtubePlayer.getPlayerState?.();
				const playerTransient = playerState === 3 || playerState === -1 || playerState === 5;
				const snapshot = readLocalYoutubeSnapshot();
				const sample = {key: youtubeContentKey(snapshot.content), position: snapshot.playback.position, status: snapshot.playback.status, rate: snapshot.playback.rate, at: now};
				let transientPause = false;
				if (!playerTransient && youtubeLastSample && now >= youtubeRemoteGuardUntil) {
					const expectedPosition = youtubeLastSample.position + (youtubeLastSample.status === "playing" ? (now - youtubeLastSample.at) / 1000 * youtubeLastSample.rate : 0);
					const localSeek = sample.key === youtubeLastSample.key && Math.abs(sample.position - expectedPosition) > YOUTUBE_LOCAL_SEEK_SECONDS;
					const contentChanged = sample.key !== youtubeContentKey(youtubeState.content);
					transientPause = youtubeSynced && youtubeState.playback.status === "playing" && sample.status === "paused" && (youtubePageInactive || isStaleYoutubePlayback(sample));
					if (transientPause) {
						applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
					} else {
						const sharedAction = localSeek || (contentChanged && now > youtubeNaturalAdvanceUntil);
						if (sharedAction && !submitYoutubeSnapshot(snapshot) && youtubeSynced && youtubeState.master) {
							youtubeSynced = false;
							renderYoutubeControls();
						}
					}
				}
				youtubeLastSample = transientPause || playerTransient ? null : sample;
				if (!roomReady || youtubeState.clockPeerId !== selfId || !youtubeState.content || now - youtubeLastHeartbeatAt < YOUTUBE_HEARTBEAT_MS) return;
				const playback = currentSharedYoutubePlayback();
				if (playback.status !== "playing") return;
				youtubeLastHeartbeatAt = now;
				youtubeState.clockSequence += 1;
				youtubeState.playback = cloneYoutubePlayback(playback);
				youtubeStateReceivedAt = now;
				connection?.sendYouTube({kind: "heartbeat", version: {...youtubeState.version}, clockSequence: youtubeState.clockSequence, content: cloneYoutubeContent(youtubeState.content), playback: cloneYoutubePlayback(playback)}).catch(error => setNotice("YouTube heartbeat failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function releaseYoutubePeer(peerId) {
				if (youtubeState.master?.peerId !== peerId && youtubeState.clockPeerId !== peerId) return;
				const clockDeparted = youtubeState.clockPeerId === peerId;
				const successor = [selfId, ...(connection?.getPeerIds() || [])].sort()[0] || selfId;
				youtubeState = {
					content: cloneYoutubeContent(youtubeState.content),
					playback: currentSharedYoutubePlayback(),
					queue: youtubeState.queue.map(entry => cloneYoutubeEntry(entry)),
					queueIndex: youtubeState.queueIndex,
					master: youtubeState.master?.peerId === peerId ? null : youtubeState.master,
					clockPeerId: clockDeparted ? successor : youtubeState.clockPeerId,
					clockSequence: 0,
					version: {counter: youtubeState.version.counter + 1, peerId: successor}
				};
				youtubeStateReceivedAt = performance.now();
				if (youtubeSynced) applyYoutubeSnapshot(youtubeState.content, youtubeState.playback);
				if (successor === selfId) sendYoutubeState(youtubeState);
				renderYoutubeControls();
			}

			function openUrl(url) {
				const popup = window.open("about:blank", "_blank");
				if (!popup) return false;
				popup.opener = null;
				popup.location.replace(url);
				return true;
			}

			function closePublisher() {
				clearInterval(publisherMonitor);
				publisherMonitor = 0;
				publisherWindow?.close();
				publisherWindow = null;
				publisherStreamId = "";
			}

			function leaveRoom(removeRoomParameter) {
				connectionGeneration += 1;
				clearTimeout(padSendTimer);
				connection?.leave();
				connection = null;
				roomReady = false;
				relayConnected = false;
				closePublisher();
				peerCount = 0;
				padState = {text: "", version: {counter: 0, peerId: ""}, actor: null};
				streamState = {mode: "home", stream: null, version: {counter: 0, peerId: ""}, actor: null};
				youtubeState = createEmptyYoutubeState();
				youtubeStateReceivedAt = performance.now();
				youtubeSynced = true;
				youtubePlayerError = "";
				youtubeRemoteGuardUntil = 0;
				youtubeNaturalAdvanceUntil = 0;
				youtubeLastSample = null;
				youtubeLastHeartbeatAt = 0;
				localYoutubeContent = null;
				localYoutubePlayback = {status: "paused", position: 0, rate: 1};
				if (youtubePlayerReady) applyYoutubeSnapshot(null, localYoutubePlayback);
				participants.clear();
				pendingOutgoingChatMessages.length = 0;
				renderParticipants();
				renderedStreamId = "";
				chatLog.replaceChildren();
				if (removeRoomParameter) {
					roomFromUrl = false;
					const nextUrl = new URL(location.href);
					nextUrl.searchParams.delete("room");
					history.replaceState(null, "", nextUrl);
				}
				render();
			}

			function updatePadState(text) {
				padState = {text, version: {counter: padState.version.counter + 1, peerId: selfId}, actor: currentActor()};
				render();
				return clonePadState(padState);
			}

			function updateStreamState(mode, stream) {
				streamState = {mode, stream, version: {counter: streamState.version.counter + 1, peerId: selfId}, actor: currentActor()};
				render();
				return cloneStreamState(streamState);
			}

			function renderLinks() {
				const urls = [...new Set((padState.text.match(URL_PATTERN) || []).map(value => validateHttpUrl(value.replace(TRAILING_PUNCTUATION, ""))).filter(Boolean))];
				detectedLinks.replaceChildren();
				for (const url of urls) {
					const item = document.createElement("li");
					const link = document.createElement("a");
					link.href = url;
					link.target = "_blank";
					link.rel = "noopener noreferrer";
					link.textContent = url;
					link.style.color = colors.accentStrong;
					link.style.overflowWrap = "anywhere";
					item.appendChild(link);
					detectedLinks.appendChild(item);
				}
			}

			function render() {
				const streamId = streamState.mode === "stream" ? streamState.stream.id : "";
				const connected = Boolean(connection);
				const joined = connected && roomReady;
				const collaborationVisible = joined && communityAccessAccepted && !(isReceiver && Boolean(streamId));
				if (isReceiver) {
					const controllerUrl = new URL(location.pathname, location.origin);
					controllerUrl.searchParams.set("room", currentRoomId);
					controllerAccessUrl.textContent = controllerUrl.href;
					controllerAccessRoom.textContent = "Room: " + currentRoomId;
				}
				roomLabel.hidden = roomFromUrl && connected;
				roomInput.hidden = roomFromUrl && connected;
				joinButton.hidden = roomFromUrl && connected;
				leaveButton.hidden = !roomFromUrl || !connected;
				roomForm.style.flex = roomFromUrl && connected ? "0" : "1 1 auto";
				content.hidden = !isReceiver && !joined;
				content.classList.toggle("solo", !joined);
				participantsPanel.hidden = !joined;
				participantsPanel.style.display = joined ? "grid" : "none";
				controllerAccessPanel.hidden = !isReceiver || !joined;
				controllerAccessPanel.style.display = isReceiver && joined ? "grid" : "none";
				navigationPanel.hidden = !isReceiver && !joined;
				navigationPanel.style.display = isReceiver || joined ? "grid" : "none";
				communityAccessPanel.hidden = !joined || communityAccessAccepted;
				communityAccessPanel.style.display = joined && !communityAccessAccepted ? "grid" : "none";
				chatPanel.hidden = !joined || !communityAccessAccepted;
				chatPanel.style.display = joined && communityAccessAccepted ? "grid" : "none";
				sharepadPanel.hidden = !collaborationVisible;
				sharepadPanel.style.display = collaborationVisible ? "grid" : "none";
				controls.hidden = !joined || (isReceiver && !collaborationVisible);
				controls.style.display = joined && (!isReceiver || collaborationVisible) ? "grid" : "none";
				youtubePanel.hidden = !collaborationVisible;
				youtubePanel.style.display = collaborationVisible ? "grid" : "none";
				streamControls.hidden = isReceiver || !joined;
				streamControls.style.display = !isReceiver && joined ? "flex" : "none";
				if (collaborationVisible) ensureYoutubePlayer();
				renderYoutubeControls();
				addressInput.disabled = !isReceiver && (!connected || !roomReady);
				openAddressButton.disabled = !isReceiver && (!connected || !roomReady);
				sendLinkCheckbox.disabled = !connected || !roomReady;
				if (!connected) sendLinkCheckbox.checked = false;
				if (!connected) {
					connectionStatus.textContent = "● Disconnected";
					connectionStatus.style.color = colors.muted;
				} else if (peerCount) {
					connectionStatus.textContent = relayConnected ? "● Connected" : "● Connected · Signaling reconnecting…";
					connectionStatus.style.color = "#5cca8f";
				} else if (!roomReady) {
					connectionStatus.textContent = "● Connecting…";
					connectionStatus.style.color = colors.accentStrong;
				} else if (!relayConnected) {
					connectionStatus.textContent = "● Reconnecting…";
					connectionStatus.style.color = colors.accentStrong;
				} else {
					connectionStatus.textContent = "● Ready";
					connectionStatus.style.color = colors.label;
				}
				participantCount.textContent = connected && !roomReady ? "Searching for users" : connected ? String(peerCount + 1) + " user" + (peerCount ? "s" : "") : "0 users";
				if (sharepad.value !== padState.text) sharepad.value = padState.text;
				streamStatus.textContent = streamId ? "Stream active" : "No active stream";
				startStream.disabled = !connected || Boolean(streamId);
				stopStream.hidden = !streamId;
				stopStream.disabled = !connected || !streamId;
				renderLinks();
				streamPanel.hidden = !isReceiver || !joined || !streamId;
				if (!isReceiver) return;
				if (!streamId) {
					renderedStreamId = "";
					streamFrame.removeAttribute("src");
					streamLink.removeAttribute("href");
				} else if (renderedStreamId !== streamId) {
					const viewUrl = new URL(VDO_BASE_URL);
					viewUrl.searchParams.set("view", streamId);
					renderedStreamId = streamId;
					streamLink.href = viewUrl.href;
					streamFrame.src = viewUrl.href;
					announceActivity("stream", streamId);
				}
			}

			function joinRoom(roomId, updateUrl = false) {
				const normalizedRoomId = roomId.trim();
				if (!normalizedRoomId) return setNotice("Room ID is required.", true);
				leaveRoom(false);
				currentRoomId = normalizedRoomId;
				roomFromUrl = updateUrl || roomFromUrl;
				if (updateUrl) {
					const nextUrl = new URL(location.href);
					nextUrl.searchParams.set("room", currentRoomId);
					history.replaceState(null, "", nextUrl);
				}
				const generation = connectionGeneration;
				try {
					connection = createRoomConnection(currentRoomId, {
						getState: () => ({pad: clonePadState(padState), stream: cloneStreamState(streamState), youtube: cloneYoutubeSharedState(youtubeState)}),
						onRelayStatus: ready => {
							if (generation !== connectionGeneration) return;
							relayConnected = ready;
							if (!ready || roomReady) return render();
							roomReady = true;
							const actor = currentActor();
							if (USER_ID_PATTERN.test(actor.userId)) {
								participants.set(actor.userId, {...actor, peerId: selfId});
								connection.sendProfile(actor);
								renderParticipants();
							}
							for (const message of pendingOutgoingChatMessages.splice(0)) {
								connection.sendChat(message).catch(error => setNotice("Chat send failed: " + (error instanceof Error ? error.message : String(error)), true));
							}
							render();
						},
						onState: snapshot => {
							if (generation !== connectionGeneration) return;
							if (isValidPadState(snapshot?.pad) && !isIgnored(snapshot.pad.actor, "chatSharepad")) padState = clonePadState(snapshot.pad);
							if (isValidStreamState(snapshot?.stream) && !isIgnored(snapshot.stream.actor, "streamLinks")) streamState = cloneStreamState(snapshot.stream);
							acceptYoutubeState(snapshot?.youtube, "", true);
							render();
						},
						onPad: candidate => {
							const newer = candidate?.version?.counter > padState.version.counter || (candidate?.version?.counter === padState.version.counter && candidate?.version?.peerId > padState.version.peerId);
							if (generation !== connectionGeneration || !isValidPadState(candidate) || !newer || isIgnored(candidate.actor, "chatSharepad")) return;
							padState = clonePadState(candidate);
							render();
						},
						onStream: candidate => {
							const newer = candidate?.version?.counter > streamState.version.counter || (candidate?.version?.counter === streamState.version.counter && candidate?.version?.peerId > streamState.version.peerId);
							if (generation !== connectionGeneration || !isValidStreamState(candidate) || !newer || isIgnored(candidate.actor, "streamLinks")) return;
							streamState = cloneStreamState(candidate);
							if (publisherStreamId && publisherStreamId !== streamState.stream?.id) closePublisher();
							render();
						},
						onNavigate: payload => {
							if (generation !== connectionGeneration || isIgnored(payload?.actor, "streamLinks")) return;
							const url = validateHttpUrl(payload?.url);
							if (!url) return;
							pendingUrl = url;
							pendingLinkActor = payload.actor;
							receivedLink.textContent = url;
							if (!linkDialog.open) linkDialog.showModal();
						},
						onChat: message => {
							if (generation !== connectionGeneration || isIgnored(message?.actor, "chatSharepad") || !USER_ID_PATTERN.test(message?.actor?.userId || "") || typeof message.actor?.name !== "string" || (message.actor?.mode !== "Web" && message.actor?.mode !== "VR") || typeof message?.text !== "string" || !Number.isSafeInteger(message?.timestamp)) return;
							if (message.actor.name.length > 40 || !message.text.trim() || message.text.length > CHAT_MESSAGE_MAX_LENGTH) return;
							if (message.actor.userId !== currentActor().userId) {
								participants.set(message.actor.userId, {...message.actor, peerId: participants.get(message.actor.userId)?.peerId || ""});
								renderParticipants();
							}
							appendChatMessage(message);
						},
						onActivity: activity => {
							if (generation !== connectionGeneration || !isValidActivity(activity) || isIgnored(activity.actor, "streamLinks")) return;
							appendChatEvent(activityText(activity), activity.timestamp);
						},
						onYouTube: (message, peerId) => {
							if (generation === connectionGeneration) handleYoutubeMessage(message, peerId);
						},
						onProfile: (actor, peerId) => {
							if (generation !== connectionGeneration || !isValidActor(actor) || actor.userId === currentActor().userId) return;
							const isNewUser = !participants.has(actor.userId);
							participants.set(actor.userId, {...actor, peerId});
							renderParticipants();
							if (isNewUser && !isIgnored(actor, "chatSharepad")) appendChatEvent((actor.name || "Anonymous") + " joined.");
						},
						onPeerJoin: () => {
							if (generation === connectionGeneration && roomReady) connection?.sendProfile(currentActor());
						},
						onPeerLeave: peerId => {
							if (generation !== connectionGeneration) return;
							for (const [userId, actor] of participants) {
								if (actor.peerId !== peerId) continue;
								participants.delete(userId);
								if (!isIgnored(actor, "chatSharepad")) appendChatEvent((actor.name || "Anonymous") + " left.");
							}
							releaseYoutubePeer(peerId);
							renderParticipants();
						},
						onPresence: count => {
							if (generation !== connectionGeneration) return;
							peerCount = count;
							render();
						},
						onError: error => {
							if (generation === connectionGeneration) setNotice("Peer connection failed: " + (error instanceof Error ? error.message : String(error)), true);
						}
					});
					render();
				} catch (error) {
					setNotice("Connection failed: " + (error instanceof Error ? error.message : String(error)), true, true);
				}
			}

			roomForm.addEventListener("submit", event => {
				event.preventDefault();
				joinRoom(roomInput.value, true);
			});

			leaveButton.addEventListener("click", () => leaveRoom(true));

			sharepad.addEventListener("input", () => {
				if (!communityAccessAccepted) return;
				updatePadState(sharepad.value);
				clearTimeout(padSendTimer);
				padSendTimer = setTimeout(() => {
					connection?.sendPad(clonePadState(padState)).catch(error => setNotice("Sharepad update failed: " + (error instanceof Error ? error.message : String(error)), true));
				}, PAD_DEBOUNCE_MS);
			});

			youtubeForm.addEventListener("submit", event => {
				event.preventDefault();
				const value = youtubeInput.value.trim();
				if (!value) return setNotice("Enter a YouTube URL or search term.", true);
				const content = parseYoutubeUrl(value);
				if (!content) return openYoutubeSearch(value);
				openYoutubeUrl(content, value);
				youtubeInput.value = "";
			});

			youtubeSearchCloseButton.addEventListener("click", closeYoutubeSearch);
			youtubeListsButton.addEventListener("click", () => openYoutubeLibrary("queue"));
			youtubeSearchTab.addEventListener("click", () => setYoutubeTab("search"));
			youtubeQueueTab.addEventListener("click", () => setYoutubeTab("queue"));
			youtubePersonalTab.addEventListener("click", () => setYoutubeTab("personal"));
			youtubeLibraryTabs.addEventListener("keydown", event => {
				const tabs = ["search", "queue", "personal"];
				const current = tabs.indexOf(youtubeLibraryTab);
				let target = -1;
				if (event.key === "ArrowRight") target = (current + 1) % tabs.length;
				else if (event.key === "ArrowLeft") target = (current + tabs.length - 1) % tabs.length;
				else if (event.key === "Home") target = 0;
				else if (event.key === "End") target = tabs.length - 1;
				if (target < 0) return;
				event.preventDefault();
				setYoutubeTab(tabs[target], true);
			});
			youtubeSearchForm.addEventListener("submit", event => {
				event.preventDefault();
				const value = youtubeSearchInput.value.trim();
				if (!value) return setYoutubeSearchStatus("Enter a YouTube URL or search term.", true);
				const content = parseYoutubeUrl(value);
				if (content) openYoutubeUrl(content, value);
				else searchYoutube(value);
			});
			youtubeSearchType.addEventListener("change", () => { youtubeSearchInput.placeholder = youtubeSearchType.value === "video" ? "Search videos" : "Search playlists"; });
			youtubeSearchDialog.addEventListener("scroll", hideYoutubeCopyHint, true);
			window.addEventListener("resize", hideYoutubeCopyHint);
			document.addEventListener("visibilitychange", handleYoutubePageActivity);
			window.addEventListener("focus", handleYoutubePageActivity);
			window.addEventListener("blur", handleYoutubePageActivity);
			window.addEventListener("keydown", event => {
				if (event.key === "Escape" && !youtubeSearchOverlay.hidden) closeYoutubeSearch();
			});

			youtubeSyncButton.addEventListener("click", () => {
				if (!roomReady) return;
				if (youtubeSynced) {
					const snapshot = readLocalYoutubeSnapshot();
					if (isYoutubeMaster()) publishYoutubeState(snapshot.content, snapshot.playback, null);
					youtubeSynced = false;
					youtubePlayerError = "";
					renderYoutubeControls();
					return;
				}
				youtubeSynced = true;
				youtubePlayerError = "";
				applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
				renderYoutubeControls();
			});

			youtubeControlButton.addEventListener("click", () => {
				if (!roomReady) return;
				if (isYoutubeMaster()) {
					publishYoutubeState(youtubeState.content, currentSharedYoutubePlayback(), null, youtubeState.queue, youtubeState.queueIndex, false, true);
					return;
				}
				if (youtubeState.master?.locked) return;
				if (!youtubeState.master) {
					publishYoutubeState(youtubeState.content, currentSharedYoutubePlayback(), {peerId: selfId, actor: currentActor(), locked: false, sharedControl: false, allowAdding: false}, youtubeState.queue, youtubeState.queueIndex, false, true);
					return;
				}
				const snapshot = readLocalYoutubeSnapshot();
				connection?.sendYouTube({kind: "takeover", actor: currentActor(), content: snapshot.content, playback: snapshot.playback}, [youtubeState.master.peerId]).then(() => setNotice("Control requested.")).catch(error => setNotice("Control request failed: " + (error instanceof Error ? error.message : String(error)), true));
			});

			youtubeSharedControlButton.addEventListener("click", () => {
				if (!isYoutubeMaster()) return;
				publishYoutubeState(youtubeState.content, currentSharedYoutubePlayback(), {...youtubeState.master, sharedControl: !youtubeState.master.sharedControl}, youtubeState.queue, youtubeState.queueIndex, false, true);
			});

			youtubeAllowAddingButton.addEventListener("click", () => {
				if (!isYoutubeMaster()) return;
				publishYoutubeState(youtubeState.content, currentSharedYoutubePlayback(), {...youtubeState.master, allowAdding: !youtubeState.master.allowAdding}, youtubeState.queue, youtubeState.queueIndex, false, true);
			});

			youtubeLockButton.addEventListener("click", () => {
				if (!isYoutubeMaster()) return;
				publishYoutubeState(youtubeState.content, currentSharedYoutubePlayback(), {...youtubeState.master, locked: !youtubeState.master.locked}, youtubeState.queue, youtubeState.queueIndex, false, true);
			});

			function openAndMaybeSendUrl(url, quickLinkLabel = "") {
				if (!openUrl(url)) return setNotice("Opening the link was blocked.", true);
				announceActivity(quickLinkLabel ? "quicklink" : "website", quickLinkLabel);
				if (sendLinkCheckbox.checked) {
					connection?.sendNavigate({url, actor: currentActor()}).then(() => setNotice("Link opened and sent.")).catch(error => setNotice("Link send failed: " + (error instanceof Error ? error.message : String(error)), true));
				}
			}

			function submitAddress() {
				const url = normalizeHttpUrl(addressInput.value);
				if (!url) return setNotice("Enter a valid HTTP or HTTPS URL.", true);
				if (isReceiver) {
					openAndMaybeSendUrl(url);
				} else {
					connection?.sendNavigate({url, actor: currentActor()}).then(() => setNotice("Link sent.")).catch(error => setNotice("Link send failed: " + (error instanceof Error ? error.message : String(error)), true));
				}
				addressInput.value = "";
			}

			addressForm.addEventListener("submit", event => {
				event.preventDefault();
				submitAddress();
			});

			openAddressButton.addEventListener("click", () => {
				submitAddress();
			});

			communityAccessForm.addEventListener("submit", event => {
				event.preventDefault();
				const name = communityNicknameInput.value.trim();
				if (!name || name === chatProfile?.name) return grantCommunityAccess();
				if (chatProfile && chatProfile.changedAt + CHAT_NAME_CHANGE_DELAY_MS > Date.now()) {
					communityAccessStatus.textContent = "The saved nickname cannot be changed yet. Accept with the current nickname or leave this field unchanged.";
					communityAccessStatus.hidden = false;
					return;
				}
				pendingCommunityAcceptance = true;
				pendingChatProfile = {userId: getUserId(), name, changedAt: Date.now()};
				nameConfirmText.textContent = name;
				nameConfirmDialog.showModal();
			});

			declineCommunityAccess.addEventListener("click", () => {
				communityAccessStatus.textContent = "Declined. Chat and Sharepad remain unavailable.";
				communityAccessStatus.hidden = false;
			});

			chatIdentityForm.addEventListener("submit", event => {
				event.preventDefault();
				const name = chatNameInput.value.trim();
				if (!name) return setNotice("Chat name is required.", true);
				if (chatProfile?.name === name) return setNotice("Enter a different chat name.", true);
				if (chatProfile && chatProfile.changedAt + CHAT_NAME_CHANGE_DELAY_MS > Date.now()) return;
				pendingChatProfile = {userId: getUserId(), name, changedAt: Date.now()};
				nameConfirmText.textContent = name;
				nameConfirmDialog.showModal();
			});

			confirmName.addEventListener("click", () => {
				if (!pendingChatProfile) return;
				try { localStorage.setItem(CHAT_PROFILE_KEY, JSON.stringify(pendingChatProfile)); } catch { return setNotice("Chat name could not be saved.", true); }
				const acceptAfterSave = pendingCommunityAcceptance;
				chatProfile = pendingChatProfile;
				pendingChatProfile = null;
				pendingCommunityAcceptance = false;
				if (roomReady) {
					const actor = currentActor();
					participants.set(actor.userId, {...actor, peerId: selfId});
					renderParticipants();
					connection?.sendProfile(actor);
				}
				chatNameInput.value = chatProfile.name;
				nameConfirmDialog.close();
				if (acceptAfterSave) grantCommunityAccess();
				else renderChatIdentity();
			});

			cancelName.addEventListener("click", () => {
				pendingChatProfile = null;
				pendingCommunityAcceptance = false;
				nameConfirmDialog.close();
			});

			chatForm.addEventListener("submit", event => {
				event.preventDefault();
				const text = chatInput.value.trim();
				if (!text) return;
				sendChatMessage(text);
			});

			chatInput.addEventListener("keydown", event => {
				if (event.key !== "Enter" || event.isComposing) return;
				event.preventDefault();
				chatForm.requestSubmit();
			});

			ignoreLink.addEventListener("click", () => { pendingUrl = ""; });

			ignoreLinkUser.addEventListener("click", () => {
				if (pendingLinkActor?.userId) {
					userRules[pendingLinkActor.userId] = {...userRules[pendingLinkActor.userId], name: pendingLinkActor.name || "Anonymous", streamLinks: true};
					saveUserRules();
				}
				pendingUrl = "";
				linkDialog.close();
			});

			document.addEventListener("pointerdown", event => {
				if (!userMenu.hidden && !userMenu.contains(event.target)) closeUserMenu();
			});
			document.addEventListener("keydown", event => {
				if (event.key === "Escape") closeUserMenu();
			});
			window.addEventListener("blur", closeUserMenu);
			window.addEventListener("resize", closeUserMenu);
			document.addEventListener("scroll", closeUserMenu, true);

			manageRulesButton.addEventListener("click", () => {
				rulesDialog.replaceChildren();
				const entries = Object.entries(userRules);
				if (!entries.length) rulesDialog.textContent = "No ignored users.";
				for (const [userId, rule] of entries) {
					const button = document.createElement("button");
					button.type = "button";
					button.textContent = (rule.name || "Anonymous") + " · " + userId.slice(0, 8);
					button.addEventListener("click", () => {
						rulesDialog.close();
						openUserMenu({userId, name: rule.name || "Anonymous", mode: ""}, undefined, undefined, manageRulesButton);
					});
					rulesDialog.appendChild(button);
				}
				const close = document.createElement("button");
				close.type = "button";
				close.textContent = "Close";
				close.addEventListener("click", () => rulesDialog.close());
				rulesDialog.appendChild(close);
				rulesDialog.showModal();
			});

			openLink.addEventListener("click", event => {
				event.preventDefault();
				if (!pendingUrl || !openUrl(pendingUrl)) return setNotice("Opening the link was blocked.", true);
				announceActivity("website");
				pendingUrl = "";
				linkDialog.close();
			});

			startStream.addEventListener("click", () => {
				if (!connection || streamState.mode === "stream") return;
				const popup = window.open("about:blank", "_blank");
				if (!popup) return setNotice("VDO.Ninja popup was blocked.", true);
				const streamId = [...crypto.getRandomValues(new Uint8Array(16))].map(value => value.toString(16).padStart(2, "0")).join("");
				const state = updateStreamState("stream", {id: streamId});
				publisherWindow = popup;
				publisherStreamId = streamId;
				connection.sendStream(state).then(() => {
					const publisherUrl = new URL(VDO_BASE_URL);
					publisherUrl.searchParams.set("push", streamId);
					publisherUrl.searchParams.set("screenshare", "");
					popup.location.replace(publisherUrl.href);
					publisherMonitor = setInterval(() => {
						if (publisherWindow?.closed && publisherStreamId === streamId && streamState.stream?.id === streamId) stopStream.click();
					}, 1000);
				}).catch(error => {
					closePublisher();
					connection?.sendStream(updateStreamState("home", null));
					setNotice("Stream start failed: " + (error instanceof Error ? error.message : String(error)), true);
				});
			});

			stopStream.addEventListener("click", () => {
				if (!connection || streamState.mode !== "stream") return;
				const state = updateStreamState("home", null);
				closePublisher();
				connection.sendStream(state).catch(error => setNotice("Stream stop failed: " + (error instanceof Error ? error.message : String(error)), true));
			});

			window.addEventListener("beforeunload", () => {
				connection?.leave();
				clearTimeout(padSendTimer);
				clearInterval(publisherMonitor);
				clearInterval(youtubeMonitor);
			});

			readChatProfile();
			readCommunityAccess();
			readYoutubePersonalPlaylist();
			try { userRules = JSON.parse(localStorage.getItem(USER_RULES_KEY) || "{}") || {}; } catch { userRules = {}; }
			renderChatIdentity();
			render();
			if (roomFromUrl) joinRoom(currentRoomId);
		</script>
	</body>
</html>
