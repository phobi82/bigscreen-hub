			function validateHttpUrl(value) {
				try {
					const url = new URL(value);
					return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
				} catch {
					return "";
				}
			}

			function normalizeHttpUrl(value) {
				const candidate = value.trim();
				return validateHttpUrl(/^[a-z][a-z\d+.-]*:\/\//i.test(candidate) ? candidate : "https://" + candidate);
			}

			function formatRemainingTime(milliseconds) {
				const totalMinutes = Math.ceil(milliseconds / 60000);
				const hours = Math.floor(totalMinutes / 60);
				const minutes = totalMinutes % 60;
				return hours + "h " + minutes + "m";
			}

			function renderChatIdentity() {
				clearTimeout(chatCooldownTimer);
				const remaining = chatProfile ? Math.max(0, chatProfile.changedAt + CHAT_NAME_CHANGE_DELAY_MS - Date.now()) : 0;
				const canChange = Boolean(chatProfile) && remaining === 0;
				chatIdentityForm.hidden = !communityAccessAccepted;
				chatIdentityForm.style.display = communityAccessAccepted ? "flex" : "none";
				chatLog.hidden = !communityAccessAccepted;
				chatLog.style.display = communityAccessAccepted ? "grid" : "none";
				chatForm.hidden = !communityAccessAccepted;

				if (chatProfile) {
					if (document.activeElement !== chatNameInput) chatNameInput.value = chatProfile.name;
					if (document.activeElement !== communityNicknameInput) communityNicknameInput.value = chatProfile.name;
					saveChatNameButton.textContent = "Change name";
					saveChatNameButton.disabled = !canChange;
					nameActionWrap.title = canChange ? "Change chat name" : "Name can be changed in " + formatRemainingTime(remaining) + ".";
					if (remaining) chatCooldownTimer = window.setTimeout(renderChatIdentity, Math.min(remaining, 60000));
				} else {
					chatNameInput.placeholder = "Nickname (optional)";
					saveChatNameButton.textContent = "Save name";
					saveChatNameButton.disabled = false;
					nameActionWrap.title = "";
				}
			}

			function readCommunityAccess() {
				try {
					const candidate = JSON.parse(localStorage.getItem(COMMUNITY_ACCESS_KEY) || "null");
					communityAccessAccepted = candidate?.version === COMMUNITY_ACCESS_VERSION && Number.isSafeInteger(candidate.acceptedAt);
				} catch {
					communityAccessAccepted = false;
				}
			}

			function grantCommunityAccess() {
				communityAccessAccepted = true;
				communityAccessStatus.hidden = true;
				try {
					localStorage.setItem(COMMUNITY_ACCESS_KEY, JSON.stringify({version: COMMUNITY_ACCESS_VERSION, acceptedAt: Date.now()}));
				} catch {
					setNotice("Community acceptance could not be saved.", true);
				}
				renderChatIdentity();
				render();
				for (const actor of participants.values()) if (actor.peerId !== selfId) sendInvitePolicy(actor);
			}

			function readChatProfile() {
				try {
					const candidate = JSON.parse(localStorage.getItem(CHAT_PROFILE_KEY) || "null");
					if (typeof candidate?.name === "string" && candidate.name.trim() && candidate.name.length <= 40 && Number.isSafeInteger(candidate.changedAt)) {
						chatProfile = {userId: USER_ID_PATTERN.test(candidate.userId || "") ? candidate.userId : getUserId(), name: candidate.name.trim(), changedAt: candidate.changedAt};
						localStorage.setItem(CHAT_PROFILE_KEY, JSON.stringify(chatProfile));
					}
				} catch {
					chatProfile = null;
				}
			}

			function getUserId() {
				try {
					const stored = localStorage.getItem("userId");
					if (USER_ID_PATTERN.test(stored || "")) return stored;
					const userId = [...crypto.getRandomValues(new Uint8Array(16))].map(value => value.toString(16).padStart(2, "0")).join("");
					localStorage.setItem("userId", userId);
					return userId;
				} catch {
					return "";
				}
			}

			function currentActor() {
				return {userId: chatProfile?.userId || getUserId(), name: chatProfile?.name || "", mode: isReceiver ? "VR" : "Web"};
			}

			function currentProfile() {
				return {...currentActor(), youtubeSynced: youtubeSynced && Boolean(youtubeState.content), vdoReceiving, vdoPrivateReceiving};
			}

			function normalizeProfile(profile, peerId) {
				if (!isValidActor(profile)) return null;
				return {...profile, peerId, youtubeSynced: profile.youtubeSynced === true, vdoReceiving: profile.vdoReceiving === true, vdoPrivateReceiving: profile.vdoPrivateReceiving === true};
			}

			function publishProfile(force = false) {
				const profile = currentProfile();
				if (!USER_ID_PATTERN.test(profile.userId)) return;
				const key = [profile.userId, profile.name, profile.mode, profile.youtubeSynced, profile.vdoReceiving, profile.vdoPrivateReceiving].join("|");
				if (!force && key === lastProfileKey) return;
				lastProfileKey = key;
				if (!roomReady) return;
				participants.set(profile.userId, {...profile, peerId: selfId});
				renderParticipants();
				if (activeUserMenuActor?.userId === profile.userId) renderUserMenuHeader(profile);
				if (roomReady) connection?.sendProfile(profile).catch(error => setNotice("Profile update failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function isIgnored(actor, rule) {
				return Boolean(actor?.userId && userRules[actor.userId]?.[rule]);
			}

			function saveUserRules() {
				try { localStorage.setItem(USER_RULES_KEY, JSON.stringify(userRules)); } catch { setNotice("User rules could not be saved.", true); }
			}

			function cloneAudience(audience) {
				return {mode: audience.mode, userIds: new Set(audience.userIds)};
			}

			function audienceActors(audience) {
				return [...participants.values()].filter(actor => actor.userId !== currentActor().userId && actor.peerId && (audience.mode === "everyone" || audience.userIds.has(actor.userId)));
			}

			function audienceLabel(audience) {
				if (audience.mode === "everyone") return "To: Everyone";
				const actors = audienceActors(audience).filter(actor => invitePolicies.get(actor.peerId) === true);
				const count = actors.length;
				if (!count) return "To: Choose recipients";
				if (count === 1) {
					const actor = actors[0];
					return "To: " + (actor.name || "Anonymous");
				}
				return "To: " + count + " users";
			}

			function selectedPrivateRecipients() {
				return audienceActors(privateStreamAudience).filter(actor => invitePolicies.get(actor.peerId) === true);

			function updatePrivateRecipientSummary() {
				const count = selectedPrivateRecipients().length;
				privateRecipientSummary.textContent = count ? count + " " + (count === 1 ? "person will" : "people will") + " be invited now. You can invite more later." : "No one selected. The stream starts only for you; invite people later from their user menu.";
				privateSelectAll.disabled = ![...participants.values()].some(actor => actor.userId !== currentActor().userId && actor.peerId && invitePolicies.get(actor.peerId) === true);
				confirmStreamStart.textContent = count ? "Start private stream for " + count + " " + (count === 1 ? "person" : "people") : "Start private stream for myself";
			}

			function renderPrivateRecipients(reset = false) {
				if (reset) privateStreamAudience.userIds.clear();
				privateRecipientList.replaceChildren();
				const recipients = [...participants.values()].filter(actor => actor.userId !== currentActor().userId && actor.peerId);
				const available = recipients.filter(actor => invitePolicies.get(actor.peerId) === true);
				const selectedCount = available.filter(actor => privateStreamAudience.userIds.has(actor.userId)).length;
				privateSelectAll.checked = available.length > 0 && selectedCount === available.length;
				privateSelectAll.indeterminate = selectedCount > 0 && selectedCount < available.length;
				if (!recipients.length) {
					const empty = document.createElement("div");
					empty.className = "audience-empty";
					empty.textContent = "No connected recipients.";
					privateRecipientList.appendChild(empty);
				}
				for (const actor of recipients) {
					const choice = document.createElement("label");
					choice.className = "audience-choice";
					const input = document.createElement("input");
					input.type = "checkbox";
					input.dataset.userId = actor.userId;
					input.disabled = invitePolicies.get(actor.peerId) !== true;
					input.checked = !input.disabled && privateStreamAudience.userIds.has(actor.userId);
					input.ariaLabel = "Invite " + (actor.name || "Anonymous") + " to the private stream";
					if (input.disabled) {
						choice.classList.add("unavailable");
						choice.title = "This user does not currently accept invitations.";
					}
					input.addEventListener("change", () => {
						if (input.checked) privateStreamAudience.userIds.add(actor.userId);
						else privateStreamAudience.userIds.delete(actor.userId);
						renderPrivateRecipients();
					});
					const identity = createUserIdentity(actor);
					if (input.disabled) identity.querySelector(".user-meta")?.appendChild(createUserBadge("Invites unavailable", "mode-unavailable", choice.title));
					choice.append(input, identity);
					privateRecipientList.appendChild(choice);
				}
				updatePrivateRecipientSummary();
			}

				if (!roomReady || !actor?.peerId) return;
				connection?.sendInvitePolicy({allowInvitations: communityAccessAccepted && !isIgnored(actor, "streamLinks"), actor: currentActor()}, [actor.peerId]).catch(error => setNotice("Invitation policy update failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function ownStreamInvitation(direct) {
				const state = streamStates.get(selfId);
				if (!state?.active || !ownStreamDestination) return null;
				return {kind: "stream", ownerPeerId: selfId, sequence: state.sequence, access: state.access, destination: {...ownStreamDestination}, actor: currentActor(), direct};
			}

			function resendOwnStreamInvitation(peerId, actor) {
				const state = streamStates.get(selfId);
				if (!state?.active || !ownStreamDestination || invitePolicies.get(peerId) !== true) return;
				const explicitlyInvited = ownStreamInvitedUserIds.has(actor.userId);
				if (!explicitlyInvited && (!ownStreamEveryone || isIgnored(actor, "streamLinks"))) return;
				const payload = ownStreamInvitation(explicitlyInvited);
				if (payload) connection?.sendInvitation(payload, [peerId]).catch(error => setNotice("Stream invitation failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function inviteUserToOwnStream(actor) {
				if (!actor?.peerId || invitePolicies.get(actor.peerId) !== true) return setNotice("Invitation blocked or recipient policy unavailable.", true);
				const payload = ownStreamInvitation(true);
				if (!payload) return;
				ownStreamInvitedUserIds.add(actor.userId);
				connection.sendInvitation(payload, [actor.peerId]).then(() => setNotice("Stream invitation sent.")).catch(error => setNotice("Stream invitation failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function sendSelectedInvitation(payload, audience, label) {
				const {direct, targets} = invitationTargets(audience);
				const candidates = audienceActors(audience).filter(actor => direct || !isIgnored(actor, "streamLinks"));
				const waiting = payload.kind === "link" ? candidates.filter(actor => actor.peerId && actor.peerId !== selfId && !invitePolicies.has(actor.peerId)) : [];
				for (const actor of waiting) {
					const queue = pendingPolicyInvitations.get(actor.peerId) || [];
					queue.push({...payload, direct});
					pendingPolicyInvitations.set(actor.peerId, queue);
				}
				if (!targets.length) {
					if (waiting.length) setNotice("Invitation waiting for recipient policy.");
					else setNotice(direct ? "Invitation blocked or recipient policy unavailable." : "No eligible recipients.", true);
					return Promise.resolve(false);
				}
				return connection.sendInvitation({...payload, direct}, targets).then(() => {
					setNotice(label + " sent.");
					return true;
				}).catch(error => {
					setNotice(label + " failed: " + (error instanceof Error ? error.message : String(error)), true);
					return false;
				});
			}

				if (typeof entry.description !== "string" || entry.description.length > YOUTUBE_ENTRY_DESCRIPTION_MAX_LENGTH || typeof entry.publishedAt !== "string" || entry.publishedAt.length > 32 || (entry.publishedAt && !Number.isFinite(Date.parse(entry.publishedAt)))) return false;

					clockPeerId: state.clockPeerId,

			function cloneYoutubeSharedState(state, playback = state === youtubeState ? currentSharedYoutubePlayback() : state.playback) {

				const includesCurrent = currentIndex >= 0 && youtubeContentKey(shared.queue[currentIndex].content) === youtubeContentKey(shared.content);

			function isValidYoutubeContent(content) {
				if (content === null) return true;
				if (!content || !Number.isSafeInteger(content.index) || content.index < 0 || content.index > 10000) return false;
				if (content.kind === "video") return YOUTUBE_VIDEO_ID_PATTERN.test(content.videoId || "") && content.playlistId === "" && content.index === 0;
				return content.kind === "playlist" && (content.videoId === "" || YOUTUBE_VIDEO_ID_PATTERN.test(content.videoId || "")) && YOUTUBE_PLAYLIST_ID_PATTERN.test(content.playlistId || "");
			}

			function isValidYoutubePlayback(playback) {
				return playback && ["playing", "paused", "ended"].includes(playback.status) && Number.isFinite(playback.position) && playback.position >= 0 && playback.position <= 86400 && Number.isFinite(playback.rate) && playback.rate >= .25 && playback.rate <= 2;
			}

			function isValidYoutubeState(state) {
				const queue = state?.queue === undefined ? [] : state.queue;
				const queueIndex = state?.queueIndex === undefined ? 0 : state.queueIndex;
				return state && isValidYoutubeContent(state.content) && isValidYoutubePlayback(state.playback) && Array.isArray(queue) && queue.length <= YOUTUBE_QUEUE_MAX_ENTRIES && queue.every(isValidYoutubeEntry) && Number.isSafeInteger(queueIndex) && queueIndex >= 0 && queueIndex <= queue.length && (state.queueCursorId === undefined || state.queueCursorId === "" || YOUTUBE_ENTRY_ID_PATTERN.test(state.queueCursorId)) && typeof state.clockPeerId === "string" && (state.clockSequence === undefined || (Number.isSafeInteger(state.clockSequence) && state.clockSequence >= 0)) && Number.isSafeInteger(state.version?.counter) && state.version.counter >= 0 && typeof state.version?.peerId === "string" && (state.master === null || (typeof state.master?.peerId === "string" && state.master.peerId && isValidActor(state.master.actor) && typeof state.master.locked === "boolean" && (state.master.sharedControl === undefined || typeof state.master.sharedControl === "boolean") && (state.master.allowAdding === undefined || typeof state.master.allowAdding === "boolean")));
			}

			function isNewerVersion(candidate, current) {
				return candidate.counter > current.counter || (candidate.counter === current.counter && candidate.peerId > current.peerId);
			}

			function parseYoutubeUrl(value) {
				let url;
				try {
					url = new URL(value.trim());
				} catch {
					return null;
				}
				if (url.protocol !== "https:" && url.protocol !== "http:") return null;
				const host = url.hostname.toLowerCase();
				const segments = url.pathname.split("/").filter(Boolean);
				let videoId = "";
				if (host === "youtu.be") videoId = segments[0] || "";
				else if (YOUTUBE_HOSTS.has(host)) {
					if (url.pathname === "/watch") videoId = url.searchParams.get("v") || "";
					else if (segments[0] === "shorts" || segments[0] === "embed") videoId = segments[1] || "";
				} else return null;
				const playlistId = url.searchParams.get("list") || "";
				const requestedIndex = Number.parseInt(url.searchParams.get("index") || "1", 10);
				const index = Number.isSafeInteger(requestedIndex) && requestedIndex > 0 && requestedIndex <= 10001 ? requestedIndex - 1 : 0;
				if (playlistId) {
					if (!YOUTUBE_PLAYLIST_ID_PATTERN.test(playlistId)) return null;
					return {kind: "playlist", videoId: YOUTUBE_VIDEO_ID_PATTERN.test(videoId) ? videoId : "", playlistId, index};
				}
				return YOUTUBE_VIDEO_ID_PATTERN.test(videoId) ? {kind: "video", videoId, playlistId: "", index: 0} : null;
			}

			function getYoutubeSearchApiKey() {
				if (!youtubeSearchApiKeyPromise) {
					youtubeSearchApiKeyPromise = import("./config.js").then(module => {
						const key = typeof module.YOUTUBE_API_KEY === "string" ? module.YOUTUBE_API_KEY.trim() : "";
						if (!key || key === "...") throw new Error("YouTube search is not configured. Add a valid key to config.js.");
						return key;
					}).catch(error => {
						youtubeSearchApiKeyPromise = null;
						if (error instanceof Error && error.message.startsWith("YouTube search is not configured.")) throw error;
						throw new Error("YouTube search is not configured. Add a valid config.js file.");
					});
				}
				return youtubeSearchApiKeyPromise;
			}

			function setYoutubeSearchStatus(message, error = false) {
				youtubeSearchStatus.textContent = message;
				youtubeSearchStatus.style.color = error ? colors.warning : colors.muted;
			}

			function decodeYoutubeText(value) {
				return String(value).replace(/&(#x[\da-f]+|#\d+|amp|quot|apos|lt|gt);/gi, (entity, code) => {
					if (code[0] === "#") {
						const hexadecimal = code[1].toLowerCase() === "x";
						const codePoint = Number.parseInt(code.slice(hexadecimal ? 2 : 1), hexadecimal ? 16 : 10);
						return Number.isSafeInteger(codePoint) && codePoint <= 0x10ffff ? String.fromCodePoint(codePoint) : entity;
					}
					return {amp: "&", quot: '"', apos: "'", lt: "<", gt: ">"}[code.toLowerCase()];
				});
			}

			function readYoutubePersonalPlaylist() {
				try {
					const candidate = JSON.parse(localStorage.getItem(YOUTUBE_PERSONAL_PLAYLIST_KEY) || "null");
					if (candidate?.version !== YOUTUBE_PERSONAL_PLAYLIST_VERSION || !Array.isArray(candidate.entries)) return;
					youtubePersonalPlaylist = candidate.entries.slice(0, YOUTUBE_PERSONAL_MAX_ENTRIES).filter(isValidYoutubeEntry).map(entry => cloneYoutubeEntry(entry));
				} catch {
					youtubePersonalPlaylist = [];
				}
			}

			function saveYoutubePersonalPlaylist(entries) {
				try {
					localStorage.setItem(YOUTUBE_PERSONAL_PLAYLIST_KEY, JSON.stringify({version: YOUTUBE_PERSONAL_PLAYLIST_VERSION, entries}));
					youtubePersonalPlaylist = entries;
					renderYoutubeLibrary();
					renderYoutubeControls();
					return true;
				} catch {
					setNotice("Personal playlist could not be saved.", true);
					return false;
				}
			}

			function addYoutubePersonalEntry(entry) {
				if (youtubePersonalPlaylist.length >= YOUTUBE_PERSONAL_MAX_ENTRIES) return setNotice("Personal playlist limit reached.", true);
				if (saveYoutubePersonalPlaylist([...youtubePersonalPlaylist, cloneYoutubeEntry(entry, true)])) setNotice("Saved to personal playlist.");
			}

			function moveYoutubePersonalEntry(index, offset) {
				const target = index + offset;
				if (target < 0 || target >= youtubePersonalPlaylist.length) return;
				const entries = youtubePersonalPlaylist.map(entry => cloneYoutubeEntry(entry));
				[entries[index], entries[target]] = [entries[target], entries[index]];
				saveYoutubePersonalPlaylist(entries);
			}

			function removeYoutubePersonalEntry(index) {
				saveYoutubePersonalPlaylist(youtubePersonalPlaylist.filter((entry, candidate) => candidate !== index).map(entry => cloneYoutubeEntry(entry)));
			}

			function applyYoutubeEntryMetadata(entry, metadata) {
				const safe = createYoutubeEntry(entry.content, metadata);
				entry.title = safe.title;
				entry.channelTitle = safe.channelTitle;
				entry.thumbnailUrl = safe.thumbnailUrl;
				entry.publishedAt = safe.publishedAt;
				entry.description = safe.description;
				return Boolean(entry.title);
			}

			function pumpYoutubeOembedQueue() {
				while (youtubeOembedActive < YOUTUBE_OEMBED_MAX_CONCURRENT && youtubeOembedQueue.length) {
					const task = youtubeOembedQueue.shift();
					youtubeOembedActive++;
					task().finally(() => {
						youtubeOembedActive--;
						pumpYoutubeOembedQueue();
					});
				}
			}

			function loadYoutubeOembedMetadata(content) {
				return new Promise((resolve, reject) => {
					youtubeOembedQueue.push(async () => {
						try {
							const url = new URL(YOUTUBE_OEMBED_API_URL);
							url.searchParams.set("url", "https://www.youtube.com/watch?v=" + content.videoId);
							url.searchParams.set("format", "json");
							const response = await fetch(url);
							const data = response.ok ? await response.json() : null;
							if (!data?.title) throw new Error("Video metadata unavailable.");
							resolve({title: data.title, channelTitle: data.author_name || "", thumbnailUrl: data.thumbnail_url || "", publishedAt: "", description: ""});
						} catch (error) {
							reject(error);
						}
					});
					pumpYoutubeOembedQueue();
				});
			}

			function queueYoutubePlaylistMetadata(playlistId) {
				return new Promise((resolve, reject) => {
					youtubePlaylistMetadataBatch.set(playlistId, {resolve, reject});
					if (youtubePlaylistBatchScheduled) return;
					youtubePlaylistBatchScheduled = true;
					queueMicrotask(flushYoutubePlaylistMetadataBatch);
				});
			}

			async function flushYoutubePlaylistMetadataBatch() {
				youtubePlaylistBatchScheduled = false;
				const batch = [...youtubePlaylistMetadataBatch.entries()].slice(0, 50);
				for (const [playlistId] of batch) youtubePlaylistMetadataBatch.delete(playlistId);
				if (youtubePlaylistMetadataBatch.size) {
					youtubePlaylistBatchScheduled = true;
					queueMicrotask(flushYoutubePlaylistMetadataBatch);
				}
				try {
					const key = await getYoutubeSearchApiKey();
					const url = new URL(YOUTUBE_PLAYLISTS_API_URL);
					url.searchParams.set("part", "snippet");
					url.searchParams.set("id", batch.map(([playlistId]) => playlistId).join(","));
					url.searchParams.set("key", key);
					const response = await fetch(url);
					const data = await response.json().catch(() => null);
					if (!response.ok || data?.error) throw new Error(data?.error?.message || "Playlist metadata unavailable.");
					const items = new Map((Array.isArray(data?.items) ? data.items : []).map(item => [item.id, item.snippet]));
					for (const [playlistId, handlers] of batch) {
						const snippet = items.get(playlistId);
						if (!snippet?.title) handlers.reject(new Error("Playlist metadata unavailable."));
						else handlers.resolve({title: snippet.title, channelTitle: snippet.channelTitle || "", thumbnailUrl: snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url || "", publishedAt: snippet.publishedAt || "", description: snippet.description || ""});
					}
				} catch (error) {
					for (const [, handlers] of batch) handlers.reject(error);
				}
			}

			function resolveYoutubeEntryMetadata(content) {
				const key = content.kind + ":" + (content.kind === "video" ? content.videoId : content.playlistId);
				if (!youtubeMetadataPromises.has(key)) youtubeMetadataPromises.set(key, content.kind === "video" ? loadYoutubeOembedMetadata(content) : queueYoutubePlaylistMetadata(content.playlistId));
				return youtubeMetadataPromises.get(key);
			}

			async function enrichVisibleYoutubeEntry(source, entryId) {
				const entries = source === "queue" ? youtubeState.queue : source === "personal" ? youtubePersonalPlaylist : [];
				const entry = entries.find(candidate => candidate.id === entryId);
				if (!entry || entry.title || youtubePendingMetadataEntryIds.has(entry.id)) return;
				youtubePendingMetadataEntryIds.add(entry.id);
				try {
					const metadata = await resolveYoutubeEntryMetadata(entry.content);
					const currentEntries = source === "queue" ? youtubeState.queue : youtubePersonalPlaylist;
					const current = currentEntries.find(candidate => candidate.id === entryId);
					if (!current || current.title || !applyYoutubeEntryMetadata(current, metadata)) return;
					if (source === "personal") saveYoutubePersonalPlaylist(youtubePersonalPlaylist.map(candidate => cloneYoutubeEntry(candidate)));
					else renderYoutubeLibrary();
				} catch {
					// Keep the stable ID fallback when metadata is unavailable.
				} finally {
					youtubePendingMetadataEntryIds.delete(entryId);
				}
			}

			function createYoutubeActionButton(label, action, disabled = false, title = "") {
				const button = document.createElement("button");
				button.type = "button";
				button.textContent = label;
				button.className = "dialog-button";
				button.disabled = disabled;
				button.title = title;
				button.addEventListener("click", action);
				return button;
			}

			function hideYoutubeCopyHint() {
				youtubeCopyTargetColumn?.classList.remove("copy-target");
				youtubeCopyTargetColumn = null;
				youtubeCopyHint.hidden = true;
			}

			function showYoutubeCopyHint(button, target) {
				hideYoutubeCopyHint();
				const panel = [youtubeSearchPanel, youtubeQueuePanel, youtubePersonalPanel].find(candidate => !candidate.hidden);
				const targetColumn = panel?.querySelector('[data-youtube-column="' + target + '"]');
				if (!targetColumn) return;
				youtubeCopyTargetColumn = targetColumn;
				targetColumn.classList.add("copy-target");
				if (matchMedia("(max-width: 800px)").matches) return;
				const dialogRect = youtubeSearchDialog.getBoundingClientRect();
				const buttonRect = button.getBoundingClientRect();
				const targetRect = targetColumn.getBoundingClientRect();
				const right = targetRect.left >= buttonRect.right;
				const start = right ? buttonRect.right : buttonRect.left;
				const end = right ? targetRect.left : targetRect.right;
				youtubeCopyHint.className = "youtube-copy-hint " + (right ? "right" : "left");
				youtubeCopyHint.style.left = Math.min(start, end) - dialogRect.left + "px";
				youtubeCopyHint.style.top = buttonRect.top + buttonRect.height / 2 - dialogRect.top + "px";
				youtubeCopyHint.style.width = Math.abs(end - start) + "px";
				youtubeCopyHint.hidden = false;
			}

			function createYoutubeTransferButton(label, target, action, disabled, title) {
				const button = document.createElement("button");
				button.type = "button";
				button.textContent = label;
				button.className = "youtube-transfer-button";
				button.disabled = disabled;
				button.title = title;
				button.ariaLabel = title;
				button.addEventListener("click", () => { hideYoutubeCopyHint(); action(); });
				button.addEventListener("pointerenter", () => showYoutubeCopyHint(button, target));
				button.addEventListener("pointerleave", hideYoutubeCopyHint);
				button.addEventListener("focus", () => showYoutubeCopyHint(button, target));
				button.addEventListener("blur", hideYoutubeCopyHint);
				return button;
			}

			function youtubeEntryLabel(entry) {
				return entry.title || (entry.content.kind === "playlist" ? entry.content.playlistId : entry.content.videoId);
			}

			function createYoutubeEntryCard(entry, source, index, compact = false) {
				const card = document.createElement("article");
				const transferLeft = source === "personal";
				card.className = "youtube-entry-card" + (compact ? " compact" : "") + (transferLeft ? " transfer-left" : "");
				card.dataset.youtubeSource = source;
				card.dataset.youtubeEntryId = entry.id;
				let thumbnail;
				if (entry.thumbnailUrl) {
					thumbnail = document.createElement("img");
					thumbnail.src = entry.thumbnailUrl;
					thumbnail.alt = "";
					thumbnail.loading = "lazy";
				} else {
					thumbnail = document.createElement("span");
					thumbnail.textContent = entry.content.kind === "playlist" ? "Playlist" : "Video";
					thumbnail.style.display = "grid";
					thumbnail.style.placeItems = "center";
					thumbnail.style.color = colors.muted;
					thumbnail.style.fontSize = ".7rem";
				}
				thumbnail.className = "youtube-entry-thumbnail";

				const details = document.createElement("div");
				details.className = "youtube-entry-details";
				const title = document.createElement("strong");
				title.className = "youtube-entry-title";
				title.textContent = youtubeEntryLabel(entry);
				const metadata = document.createElement("span");
				metadata.className = "youtube-entry-meta";
				const type = entry.content.kind === "playlist" ? "Playlist" : "Video";
				const queueStatus = source !== "queue" ? "" : index === youtubeState.queueIndex - 1 && youtubeContentKey(entry.content) === youtubeContentKey(youtubeState.content) ? "Now playing" : index < youtubeState.queueIndex ? "Played" : "Up next";
				metadata.textContent = [queueStatus, type, entry.channelTitle, entry.publishedAt ? new Date(entry.publishedAt).toLocaleDateString() : ""].filter(Boolean).join(" · ") || type;
				details.append(title, metadata);
				if (!entry.title) {
					const id = document.createElement("span");
					id.className = "youtube-entry-meta";
					id.textContent = youtubePendingMetadataEntryIds.has(entry.id) ? "Loading title…" : "Metadata unavailable";
					details.appendChild(id);
				}
				if (!compact && entry.description) {
					const description = document.createElement("span");
					description.className = "youtube-entry-description";
					description.textContent = entry.description;
					details.appendChild(description);
				}

				const actions = document.createElement("div");
				actions.className = "youtube-entry-actions";
				const pending = youtubePendingMetadataEntryIds.has(entry.id);
				const transfer = document.createElement("div");
				transfer.className = "youtube-entry-transfer";
				if (source === "search") {
					actions.appendChild(createYoutubeActionButton("Play now", () => { closeYoutubeSearch(); loadYoutubeContent(entry.content); }));
					transfer.append(
						createYoutubeTransferButton(">>", "queue", () => requestYoutubeQueueMutation({type: "add", entry: cloneYoutubeEntry(entry, true)}), pending || !canAddYoutubeQueue(), "Copy to room queue"),
						createYoutubeTransferButton(">>>", "personal", () => addYoutubePersonalEntry(entry), pending || youtubePersonalPlaylist.length >= YOUTUBE_PERSONAL_MAX_ENTRIES, "Copy to personal playlist")
					);
				} else if (source === "queue") {
					transfer.appendChild(createYoutubeTransferButton(">>", "personal", () => addYoutubePersonalEntry(entry), pending || youtubePersonalPlaylist.length >= YOUTUBE_PERSONAL_MAX_ENTRIES, "Copy to personal playlist"));
					if (!compact) actions.append(
						createYoutubeActionButton("Play now", () => requestYoutubeQueueMutation({type: "play", id: entry.id}), !canEditYoutubeQueue()),
						createYoutubeActionButton("↑", () => requestYoutubeQueueMutation({type: "move", id: entry.id, offset: -1}), !canEditYoutubeQueue() || index <= youtubeState.queueIndex, "Move up"),
						createYoutubeActionButton("↓", () => requestYoutubeQueueMutation({type: "move", id: entry.id, offset: 1}), !canEditYoutubeQueue() || index < youtubeState.queueIndex || index === youtubeState.queue.length - 1, "Move down"),
						createYoutubeActionButton("Remove", () => requestYoutubeQueueMutation({type: "remove", id: entry.id}), !canEditYoutubeQueue())
					);
				} else {
					transfer.appendChild(createYoutubeTransferButton("<<", "queue", () => requestYoutubeQueueMutation({type: "add", entry: cloneYoutubeEntry(entry, true)}), pending || !canAddYoutubeQueue(), "Copy to room queue"));
					if (!compact) actions.append(
						createYoutubeActionButton("Play now", () => loadYoutubeContent(entry.content)),
						createYoutubeActionButton("↑", () => moveYoutubePersonalEntry(index, -1), index === 0, "Move up"),
						createYoutubeActionButton("↓", () => moveYoutubePersonalEntry(index, 1), index === youtubePersonalPlaylist.length - 1, "Move down"),
						createYoutubeActionButton("Remove", () => removeYoutubePersonalEntry(index))
					);
				}
				if (!compact && actions.childElementCount) details.appendChild(actions);
				if (transferLeft) card.append(transfer, thumbnail, details);
				else card.append(thumbnail, details, transfer);
				if (!entry.title && source !== "search" && youtubeMetadataObserver) youtubeMetadataObserver.observe(card);
				return card;
			}

			function clearYoutubeEntryList(target) {
				if (youtubeMetadataObserver) for (const card of target.querySelectorAll(".youtube-entry-card")) youtubeMetadataObserver.unobserve(card);
				target.replaceChildren();
			}

			function renderYoutubeList(target, entries, source, compact) {
				clearYoutubeEntryList(target);
				if (!entries.length) {
					const empty = document.createElement("small");
					empty.textContent = source === "queue" ? "Queue is empty." : "Personal playlist is empty.";
					empty.style.color = colors.muted;
					return target.appendChild(empty);
				}
				entries.forEach((entry, index) => target.appendChild(createYoutubeEntryCard(entry, source, index, compact)));
			}

			function renderYoutubeLibrary() {
				hideYoutubeCopyHint();
				const tabs = {search: youtubeSearchTab, queue: youtubeQueueTab, personal: youtubePersonalTab};
				const panels = {search: youtubeSearchPanel, queue: youtubeQueuePanel, personal: youtubePersonalPanel};
				youtubeQueueTab.textContent = "Room Queue · " + youtubeState.queue.length;
				youtubePersonalTab.textContent = "Personal Playlist · " + youtubePersonalPlaylist.length;
				for (const [name, tab] of Object.entries(tabs)) {
					const active = name === youtubeLibraryTab;
					tab.setAttribute("aria-selected", String(active));
					tab.tabIndex = active ? 0 : -1;
					panels[name].hidden = !active;
				}
				const queueHeading = "Room Queue · " + youtubeState.queueIndex + " played · " + (youtubeState.queue.length - youtubeState.queueIndex) + " upcoming";
				if (youtubeLibraryTab === "search") {
					clearYoutubeEntryList(youtubeSearchResults);
					youtubeSearchResults.append(...youtubeSearchEntries.map((entry, index) => createYoutubeEntryCard(entry, "search", index)));
					youtubeSearchQueueColumn.heading.textContent = "Room Queue · " + youtubeState.queue.length;
					youtubeSearchPersonalColumn.heading.textContent = "Personal · " + youtubePersonalPlaylist.length;
					renderYoutubeList(youtubeSearchQueueColumn.list, youtubeState.queue, "queue", true);
					renderYoutubeList(youtubeSearchPersonalColumn.list, youtubePersonalPlaylist, "personal", true);
				} else if (youtubeLibraryTab === "queue") {
					youtubeQueueColumn.heading.textContent = queueHeading;
					youtubeQueuePersonalColumn.heading.textContent = "Personal Playlist";
					renderYoutubeList(youtubeQueueColumn.list, youtubeState.queue, "queue", false);
					renderYoutubeList(youtubeQueuePersonalColumn.list, youtubePersonalPlaylist, "personal", true);
				} else {
					youtubePersonalQueueColumn.heading.textContent = "Room Queue · " + youtubeState.queue.length;
					youtubePersonalColumn.heading.textContent = "Personal Playlist";
					renderYoutubeList(youtubePersonalQueueColumn.list, youtubeState.queue, "queue", true);
					renderYoutubeList(youtubePersonalColumn.list, youtubePersonalPlaylist, "personal", false);
				}
			}

			function setYoutubeTab(tab, focus = false) {
				if (!["search", "queue", "personal"].includes(tab)) return;
				youtubeLibraryTab = tab;
				hideYoutubeCopyHint();
				renderYoutubeLibrary();
				if (focus) ({search: youtubeSearchTab, queue: youtubeQueueTab, personal: youtubePersonalTab})[tab].focus();
			}

			function showYoutubeDialog(tab) {
				youtubeSearchTitle.textContent = "YouTube";
				youtubeSearchOverlay.hidden = false;
				youtubeSearchOverlay.style.display = "flex";
				setYoutubeTab(tab);
			}

			function closeYoutubeSearch() {
				youtubeSearchController?.abort();
				youtubeSearchController = null;
				youtubeSearchButton.disabled = false;
				youtubeSearchOverlay.hidden = true;
				youtubeSearchOverlay.style.display = "none";
				hideYoutubeCopyHint();
				youtubeInput.focus();
			}

			function openYoutubeSearch(query) {
				showYoutubeDialog("search");
				youtubeSearchInput.value = query;
				youtubeSearchInput.focus();
				searchYoutube(query);
			}

			function openYoutubeUrl(content, value = "") {
				showYoutubeDialog("search");
				if (value) youtubeSearchInput.value = value;
				const entry = createYoutubeEntry(content);
				youtubeSearchEntries = [entry];
				youtubePendingMetadataEntryIds.add(entry.id);
				setYoutubeSearchStatus("Loading title…");
				renderYoutubeLibrary();
				resolveYoutubeEntryMetadata(content).then(metadata => {
					const current = youtubeSearchEntries.find(candidate => candidate.id === entry.id);
					if (current && applyYoutubeEntryMetadata(current, metadata)) setYoutubeSearchStatus("URL ready.");
				}).catch(() => {
					if (youtubeSearchEntries.some(candidate => candidate.id === entry.id)) setYoutubeSearchStatus("Title unavailable. The content ID will be used.", true);
				}).finally(() => {
					youtubePendingMetadataEntryIds.delete(entry.id);
					if (youtubeLibraryTab === "search") renderYoutubeLibrary();
				});
			}

			function openYoutubeLibrary(tab = "queue") {
				showYoutubeDialog(tab);
			}

			function renderYoutubeSearchResults(items) {
				clearYoutubeEntryList(youtubeSearchResults);
				youtubeSearchEntries = [];
				let resultCount = 0;
				for (const item of items) {
					const videoId = item.id?.videoId || "";
					const playlistId = item.id?.playlistId || "";
					const content = YOUTUBE_VIDEO_ID_PATTERN.test(videoId) ? {kind: "video", videoId, playlistId: "", index: 0} : YOUTUBE_PLAYLIST_ID_PATTERN.test(playlistId) ? {kind: "playlist", videoId: "", playlistId, index: 0} : null;
					if (!content) continue;
					const entry = createYoutubeEntry(content, {
						title: decodeYoutubeText(item.snippet?.title || ""),
						channelTitle: decodeYoutubeText(item.snippet?.channelTitle || ""),
						thumbnailUrl: item.snippet?.thumbnails?.medium?.url || item.snippet?.thumbnails?.default?.url || "",
						publishedAt: item.snippet?.publishedAt || item.snippet?.publishTime || "",
						description: decodeYoutubeText(item.snippet?.description || "")
					});
					youtubeSearchEntries.push(entry);
					youtubeSearchResults.appendChild(createYoutubeEntryCard(entry, "search", resultCount));
					resultCount++;
				}
				return resultCount;
			}

			async function searchYoutube(query) {
				const normalizedQuery = query.trim();
				if (!normalizedQuery) return setYoutubeSearchStatus("Enter a search term.", true);
				setYoutubeTab("search");
				const searchKey = youtubeSearchType.value + ":" + normalizedQuery;
				if (youtubeSearchController && searchKey === youtubeSearchQuery) return;
				youtubeSearchController?.abort();

					return;
				}
				if (message.kind === "controlDenied") {
					if (senderPeerId !== youtubeState.master?.peerId || !youtubeSynced) return;
					youtubeSynced = false;
					setNotice("The controller rejected this YouTube action.", true);
					renderYoutubeControls();
					return;
				}
				if (message.kind === "takeoverDenied") {
					if (senderPeerId === youtubeState.master?.peerId) setNotice("The controller rejected takeover.", true);
					return;
				}
				if (message.kind === "control") {
					if (!isYoutubeMaster() || !isYoutubeActorFromPeer(message.actor, senderPeerId) || !isValidYoutubeContent(message.content) || !isValidYoutubePlayback(message.playback)) return;
					if (!youtubeState.master.sharedControl || isIgnored(message.actor, "youtubeControl")) {
						connection?.sendYouTube({kind: "controlDenied"}, [senderPeerId]).catch(error => setNotice("YouTube control response failed: " + (error instanceof Error ? error.message : String(error)), true));
						return;
					}
					applyYoutubeSnapshot(message.content, message.playback);
					publishYoutubeState(message.content, message.playback, youtubeState.master);
					return;
				}
				if (message.kind !== "takeover" || !isYoutubeMaster() || !isYoutubeActorFromPeer(message.actor, senderPeerId) || !isValidYoutubeContent(message.content) || !isValidYoutubePlayback(message.playback)) return;
				if (youtubeState.master.locked || isIgnored(message.actor, "youtubeControl")) {
					connection?.sendYouTube({kind: "takeoverDenied"}, [senderPeerId]).catch(error => setNotice("YouTube takeover response failed: " + (error instanceof Error ? error.message : String(error)), true));
					return;
				}
				youtubeState = {
					content: cloneYoutubeContent(message.content),
					playback: cloneYoutubePlayback(message.playback),
					queue: youtubeState.queue.map(entry => cloneYoutubeEntry(entry)),
					queueIndex: youtubeState.queueIndex,
					master: {peerId: senderPeerId, actor: {...message.actor}, locked: false, sharedControl: false, allowAdding: false},
					clockPeerId: senderPeerId,
					clockSequence: 0,
					version: {counter: youtubeState.version.counter + 1, peerId: selfId}
				};
				youtubeStateReceivedAt = performance.now();
				youtubeSynced = true;
				applyYoutubeSnapshot(youtubeState.content, youtubeState.playback);
				sendYoutubeState(youtubeState);
				renderYoutubeControls();
			}

			function handleYoutubePlayerState(event) {
				const status = youtubeStatusFromPlayer(event.data);
				if (event.data === 3 || event.data === -1 || event.data === 5) return;
				if (status === "paused" && performance.now() < youtubeRemoteGuardUntil) return;
				if (status === "paused" && youtubePageInactive && youtubeSynced && youtubeState.playback.status === "playing") {
					applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
					return;
				}
				if (youtubePlayerError && [0, 1, 2, 5].includes(event.data)) {
					youtubePlayerError = "";
					renderYoutubeControls();
				}
				localYoutubePlayback.status = status;
				if (status === "ended" && localYoutubeContent?.kind === "playlist") youtubeNaturalAdvanceUntil = performance.now() + 3000;
				if (performance.now() < youtubeRemoteGuardUntil) return;
				if (status === "ended" && youtubeSynced && youtubeState.queueIndex < youtubeState.queue.length) {
					const playlist = localYoutubeContent?.kind === "playlist" ? youtubePlayer.getPlaylist?.() : null;
					const playlistIndex = localYoutubeContent?.kind === "playlist" ? youtubePlayer.getPlaylistIndex?.() : -1;
					const contentFinished = localYoutubeContent?.kind === "video" || (Array.isArray(playlist) && playlist.length > 0 && playlistIndex === playlist.length - 1);
					if (contentFinished) {
						requestYoutubeQueueMutation({type: "advance", expectedContentKey: youtubeContentKey(youtubeState.content)});
						return;
					}
				}
				const snapshot = readLocalYoutubeSnapshot();
				if (isStaleYoutubePlayback(snapshot.playback)) {
					applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
					return;
				}
				if (!submitYoutubeSnapshot(snapshot) && youtubeSynced && youtubeState.master && status !== youtubeState.playback.status && status !== "ended") {
					youtubeSynced = false;
					renderYoutubeControls();
				}
			}

			function handleYoutubePlaybackRate() {
				if (performance.now() < youtubeRemoteGuardUntil) return;
				const snapshot = readLocalYoutubeSnapshot();
				if (!submitYoutubeSnapshot(snapshot) && youtubeSynced && youtubeState.master) {
					youtubeSynced = false;
					renderYoutubeControls();
				}
			}

			function monitorYoutubePlayer() {
				if (!youtubePlayerReady || !youtubePlayer) return;
				const now = performance.now();
				const playerState = youtubePlayer.getPlayerState?.();
				const playerTransient = playerState === 3 || playerState === -1 || playerState === 5;
				const snapshot = readLocalYoutubeSnapshot();
				const sample = {key: youtubeContentKey(snapshot.content), position: snapshot.playback.position, status: snapshot.playback.status, rate: snapshot.playback.rate, at: now};
				let transientPause = false;
				if (!playerTransient && youtubeLastSample && now >= youtubeRemoteGuardUntil) {
					const expectedPosition = youtubeLastSample.position + (youtubeLastSample.status === "playing" ? (now - youtubeLastSample.at) / 1000 * youtubeLastSample.rate : 0);
					const localSeek = sample.key === youtubeLastSample.key && Math.abs(sample.position - expectedPosition) > YOUTUBE_LOCAL_SEEK_SECONDS;
					const contentChanged = sample.key !== youtubeContentKey(youtubeState.content);
					transientPause = youtubeSynced && youtubeState.playback.status === "playing" && sample.status === "paused" && (youtubePageInactive || isStaleYoutubePlayback(sample));
					if (transientPause) {
						applyYoutubeSnapshot(youtubeState.content, currentSharedYoutubePlayback());
					} else {
						const sharedAction = localSeek || (contentChanged && now > youtubeNaturalAdvanceUntil);
						if (sharedAction && !submitYoutubeSnapshot(snapshot) && youtubeSynced && youtubeState.master) {
							youtubeSynced = false;
							renderYoutubeControls();
						}
					}
				}
				youtubeLastSample = transientPause || playerTransient ? null : sample;
				if (!roomReady || youtubeState.clockPeerId !== selfId || !youtubeState.content || now - youtubeLastHeartbeatAt < YOUTUBE_HEARTBEAT_MS) return;
				const playback = currentSharedYoutubePlayback();
				if (playback.status !== "playing") return;
				youtubeLastHeartbeatAt = now;
				youtubeState.clockSequence += 1;
				youtubeState.playback = cloneYoutubePlayback(playback);
				youtubeStateReceivedAt = now;
				connection?.sendYouTube({kind: "heartbeat", version: {...youtubeState.version}, clockSequence: youtubeState.clockSequence, content: cloneYoutubeContent(youtubeState.content), playback: cloneYoutubePlayback(playback)}).catch(error => setNotice("YouTube heartbeat failed: " + (error instanceof Error ? error.message : String(error)), true));
			}

			function releaseYoutubePeer(peerId) {
				if (youtubeState.master?.peerId !== peerId && youtubeState.clockPeerId !== peerId) return;
				const clockDeparted = youtubeState.clockPeerId === peerId;
				const successor = [selfId, ...(connection?.getPeerIds() || [])].sort()[0] || selfId;
				youtubeState = {
					content: cloneYoutubeContent(youtubeState.content),
					playback: currentSharedYoutubePlayback(),
					queue: youtubeState.queue.map(entry => cloneYoutubeEntry(entry)),
					queueIndex: youtubeState.queueIndex,
					master: youtubeState.master?.peerId === peerId ? null : youtubeState.master,
					clockPeerId: clockDeparted ? successor : youtubeState.clockPeerId,
					clockSequence: 0,
					version: {counter: youtubeState.version.counter + 1, peerId: successor}
				};
				youtubeStateReceivedAt = performance.now();
				if (youtubeSynced) applyYoutubeSnapshot(youtubeState.content, youtubeState.playback);
				if (successor === selfId) sendYoutubeState(youtubeState);
				renderYoutubeControls();
			}

			function openUrl(url) {
				const popup = window.open("about:blank", "_blank");
				if (!popup) return false;
				popup.opener = null;
				popup.location.replace(url);
				return true;
			}

			function closePublisher() {
				clearInterval(publisherMonitor);
				publisherMonitor = 0;
				publisherWindow?.close();
				publisherWindow = null;
			}

			function setVdoReceiving(receiving) {
				const privateReceiving = receiving && streamSources.get(selectedStreamKey)?.access === "hub";
				if (vdoReceiving === receiving && vdoPrivateReceiving === privateReceiving) return;
				vdoReceiving = receiving;
				vdoPrivateReceiving = privateReceiving;
				publishProfile();
				renderMediaTabs();
			}

			function streamSourceKey(access, destination) {
				return access === "public" ? "public:" + destination.room : "hub:" + destination.id;
			}

			function isValidStreamInvitation(payload) {
				if (!payload || payload.kind !== "stream" || typeof payload.ownerPeerId !== "string" || !payload.ownerPeerId || !Number.isSafeInteger(payload.sequence) || payload.sequence < 1 || (payload.access !== "public" && payload.access !== "hub") || !isValidActor(payload.actor) || typeof payload.direct !== "boolean") return false;
				return payload.access === "public" ? ROOM_ID_PATTERN.test(payload.destination?.room || "") : STREAM_ID_PATTERN.test(payload.destination?.id || "");
			}

			function selectedStreamSource() {
				return streamSources.get(selectedStreamKey) || null;
			}

			function selectStreamSource(key, switchTab = false, resolveInvitation = false) {
				if (key && !streamSources.has(key)) return;
				selectedStreamKey = key;
				if (resolveInvitation && key) {
					for (let index = invitationQueue.length - 1; index >= 0; index -= 1) if (invitationQueue[index].sourceKey === key) invitationQueue.splice(index, 1);
					if (activeInvitation?.kind === "stream" && activeInvitation.sourceKey === key) finishInvitation();
				}
				if (switchTab) {
					mediaTab = "stream";
					mediaTabManuallySelected = false;
				}
				ensureStreamPlayer(roomReady);
				renderStreamSources();
				renderMediaTabs();
			}

			function chooseStreamFallback() {
				const fallback = [...streamSources.values()].sort((left, right) => right.invitedAt - left.invitedAt)[0];
				selectStreamSource(fallback?.key || "", false, true);
			}

			function removeStreamOwner(ownerPeerId, maximumSequence = Number.MAX_SAFE_INTEGER) {
				let selectedRemoved = false;
				for (const [key, source] of streamSources) {
					const owner = source.owners.get(ownerPeerId);
					if (!owner || owner.sequence > maximumSequence) continue;
					source.owners.delete(ownerPeerId);
					if (source.owners.size) continue;
					streamSources.delete(key);
					if (selectedStreamKey === key) selectedRemoved = true;
				}
				for (let index = invitationQueue.length - 1; index >= 0; index -= 1) {
					if (invitationQueue[index].payload?.ownerPeerId === ownerPeerId) invitationQueue.splice(index, 1);
				}
				if (activeInvitation?.payload?.ownerPeerId === ownerPeerId) finishInvitation();
				if (selectedRemoved) chooseStreamFallback();
				else renderStreamSources();
			}

			function addStreamInvitation(payload, senderPeerId, local = false) {
				if (!isValidStreamInvitation(payload) || (!local && payload.ownerPeerId !== senderPeerId) || (!local && isIgnored(payload.actor, "streamLinks"))) return false;
				const lifecycle = streamStates.get(payload.ownerPeerId);
				if (lifecycle && (lifecycle.sequence > payload.sequence || lifecycle.sequence === payload.sequence && !lifecycle.active)) return false;
				const key = streamSourceKey(payload.access, payload.destination);
				let source = streamSources.get(key);
				const newDestination = !source;
				if (!source) {
					source = {key, access: payload.access, room: payload.destination.room || "", id: payload.destination.id || "", owners: new Map(), invitedAt: ++streamInvitationCounter};
					streamSources.set(key, source);
				}
				const currentOwner = source.owners.get(payload.ownerPeerId);
				if (currentOwner?.sequence >= payload.sequence) return false;
				source.owners.set(payload.ownerPeerId, {sequence: payload.sequence, actor: payload.actor});
				source.invitedAt = ++streamInvitationCounter;
				if (!selectedStreamKey) selectStreamSource(key, true);
				else if (selectedStreamKey !== key && local) selectStreamSource(key, true);
				else if (selectedStreamKey !== key && !local && newDestination) enqueueInvitation({kind: "stream", payload, sourceKey: key});
				renderStreamSources();
				return true;
			}

			function renderStreamSources() {
				streamSourceList.replaceChildren();
				if (!streamSources.size) {
					const empty = document.createElement("small");
					empty.textContent = "Waiting in public room " + currentRoomId;
					empty.style.color = colors.muted;
					streamSourceList.appendChild(empty);
					return;
				}
				for (const source of [...streamSources.values()].sort((left, right) => right.invitedAt - left.invitedAt)) {
					const button = document.createElement("button");
					button.type = "button";
					button.className = "stream-source-button";
					const firstOwner = source.owners.values().next().value;
					const count = source.owners.size;
					button.textContent = source.access === "public" ? "Public · " + source.room + " · " + count + " sender" + (count === 1 ? "" : "s") : "Private · " + (firstOwner?.actor.name || "Anonymous") + (count > 1 ? " · " + count + " senders" : "");
					button.ariaPressed = String(source.key === selectedStreamKey);
					button.addEventListener("click", () => selectStreamSource(source.key, false, true));
					streamSourceList.appendChild(button);
				}
			}

			function ensureStreamPlayer(joined) {
				if (!joined) return;
				const source = selectedStreamSource();
				const target = source ? source.key : "public:" + currentRoomId;
				if (renderedStreamTarget === target) return;
				clearInterval(vdoStatusTimer);
				vdoStatusTimer = 0;
				selectedVdoStreamIds.clear();
				setVdoReceiving(false);
				const viewUrl = new URL(VDO_BASE_URL);
				if (source?.access === "hub") {
					viewUrl.searchParams.set("view", source.id);
					streamFrame.title = "VDO.Ninja private stream";
				} else {
					viewUrl.searchParams.set("room", source?.room || currentRoomId);
					viewUrl.searchParams.set("scene", "");
					viewUrl.searchParams.set("videobitrate", "8000");
					viewUrl.searchParams.set("totalscenebitrate", "24000");
					streamFrame.title = "VDO.Ninja public stream mixer";
				}
				renderedStreamTarget = target;
				streamFrame.src = viewUrl.href;
			}

			function renderMediaTabs() {
				const streamAvailable = streamSources.size > 0 || (!selectedStreamKey && vdoReceiving);
				if (!streamAvailable && mediaTab === "stream") mediaTab = "youtube";
				const youtubeSelected = mediaTab === "youtube";
				if (!youtubeSelected) preserveMediaPanelHeight();
				streamMediaTab.hidden = !streamAvailable;
				streamMediaTab.style.display = streamAvailable ? "" : "none";
				youtubeMediaTab.disabled = !communityAccessAccepted;
				youtubeMediaTab.setAttribute("aria-selected", String(youtubeSelected));
				youtubeMediaTab.tabIndex = youtubeSelected ? 0 : -1;
				streamMediaTab.setAttribute("aria-selected", String(!youtubeSelected));
				streamMediaTab.tabIndex = youtubeSelected ? -1 : 0;
				youtubeContent.hidden = !youtubeSelected;
				youtubeContent.style.display = youtubeSelected ? "grid" : "none";
				streamContent.hidden = youtubeSelected;
				streamContent.style.display = youtubeSelected ? "none" : "block";
			}

			function preserveMediaPanelHeight() {
				const height = Math.ceil(youtubeContent.getBoundingClientRect().height);
				if (height) streamContent.style.minHeight = height + "px";
			}

			function selectMediaTab(tab, manual = true) {
				if (tab === "youtube" && !communityAccessAccepted) return;
				mediaTab = tab;
				if (manual && streamSources.size > 0) mediaTabManuallySelected = true;
				renderMediaTabs();
			}

			function leaveRoom(removeRoomParameter) {
				if (activeAudienceAction) closeAudienceAction();
				if (directLinkDialog.open) directLinkDialog.close();
				connectionGeneration += 1;
				clearTimeout(padSendTimer);
				connection?.leave();
				connection = null;
				roomReady = false;
				relayConnected = false;
				closePublisher();
				peerCount = 0;
				padState = {text: "", version: {counter: 0, peerId: ""}, actor: null};
				streamStates.clear();
				youtubeState = createEmptyYoutubeState();
				youtubeStateReceivedAt = performance.now();
				youtubeSynced = true;
				youtubePlayerError = "";
				youtubeRemoteGuardUntil = 0;
				youtubeNaturalAdvanceUntil = 0;
				youtubeLastSample = null;
				youtubeLastHeartbeatAt = 0;
				localYoutubeContent = null;
				localYoutubePlayback = {status: "paused", position: 0, rate: 1};
				if (youtubePlayerReady) applyYoutubeSnapshot(null, localYoutubePlayback);
				participants.clear();
				invitePolicies.clear();
				pendingPolicyInvitations.clear();
				linkAudience.mode = "everyone";
				linkAudience.userIds.clear();
				privateStreamAudience.userIds.clear();
				streamSources.clear();
				invitationQueue.length = 0;
				activeInvitation = null;
				if (linkDialog.open) linkDialog.close();
				pendingOutgoingChatMessages.length = 0;
				renderParticipants();
				renderedStreamTarget = "";
				clearInterval(vdoStatusTimer);
				vdoStatusTimer = 0;
				selectedVdoStreamIds.clear();
				vdoReceiving = false;
				vdoPrivateReceiving = false;
				lastProfileKey = "";
				mediaTab = "youtube";
				mediaTabManuallySelected = false;
				selectedStreamKey = "";
				streamInvitationCounter = 0;
				ownStreamDestination = null;
				ownStreamEveryone = false;
				ownStreamInvitedUserIds.clear();
				streamFrame.removeAttribute("src");
				chatLog.replaceChildren();
				if (removeRoomParameter) {
					roomFromUrl = false;
					const nextUrl = new URL(location.href);
					nextUrl.searchParams.delete("room");
					history.replaceState(null, "", nextUrl);
				}
				render();
			}

			function updatePadState(text) {
				padState = {text, version: {counter: padState.version.counter + 1, peerId: selfId}, actor: currentActor()};
				render();
				return clonePadState(padState);
			}

			function renderLinks() {
				const urls = [...new Set((padState.text.match(URL_PATTERN) || []).map(value => validateHttpUrl(value.replace(TRAILING_PUNCTUATION, ""))).filter(Boolean))];
				detectedLinks.replaceChildren();
				for (const url of urls) {
					const item = document.createElement("li");
					const link = document.createElement("a");
					link.href = url;
					link.target = "_blank";
					link.rel = "noopener noreferrer";
					link.textContent = url;
					link.style.color = colors.accentStrong;
					link.style.overflowWrap = "anywhere";
					item.appendChild(link);
					detectedLinks.appendChild(item);
				}
			}

			function render() {
				const connected = Boolean(connection);
				const joined = connected && roomReady;
				const collaborationVisible = joined && communityAccessAccepted;
				const activeStreams = [...streamStates.values()].filter(state => state.active);
				const localStream = streamStates.get(selfId);
				if (isReceiver) {
					const controllerUrl = new URL(location.pathname, location.origin);
					controllerUrl.searchParams.set("room", currentRoomId);
					controllerAccessUrl.textContent = controllerUrl.href;
					controllerAccessRoom.textContent = "Room: " + currentRoomId;
				}
				roomLabel.hidden = roomFromUrl && connected;
				roomInput.hidden = roomFromUrl && connected;
				joinButton.hidden = roomFromUrl && connected;
				leaveButton.hidden = !roomFromUrl || !connected;
				roomForm.style.flex = roomFromUrl && connected ? "0" : "1 1 auto";
				content.hidden = !isReceiver && !joined;
				content.classList.toggle("solo", !joined);
				participantsPanel.hidden = !joined;
				participantsPanel.style.display = joined ? "grid" : "none";
				controllerAccessPanel.hidden = !isReceiver || !joined;
				controllerAccessPanel.style.display = isReceiver && joined ? "grid" : "none";
				navigationPanel.hidden = !collaborationVisible;
				navigationPanel.style.display = collaborationVisible ? "grid" : "none";
				communityAccessPanel.hidden = !joined || communityAccessAccepted;
				communityAccessPanel.style.display = joined && !communityAccessAccepted ? "grid" : "none";
				chatPanel.hidden = !joined || !communityAccessAccepted;
				chatPanel.style.display = joined && communityAccessAccepted ? "grid" : "none";
				sharepadPanel.hidden = !collaborationVisible;
				sharepadPanel.style.display = collaborationVisible ? "grid" : "none";
				const controlsVisible = collaborationVisible;
				const mediaVisible = collaborationVisible;
				controls.hidden = !controlsVisible;
				controls.style.display = controlsVisible ? "grid" : "none";
				youtubePanel.hidden = !mediaVisible;
				youtubePanel.style.display = mediaVisible ? "grid" : "none";
				streamControls.hidden = isReceiver || !collaborationVisible;
				streamControls.style.display = !isReceiver && collaborationVisible ? "flex" : "none";
				if (collaborationVisible) ensureYoutubePlayer();
				if (collaborationVisible) ensureStreamPlayer(true);
				renderMediaTabs();
				renderStreamSources();
				renderYoutubeControls();
				addressInput.disabled = !isReceiver && (!connected || !roomReady);
				openAddressButton.disabled = !isReceiver && (!connected || !roomReady);
				sendLinkCheckbox.disabled = !connected || !roomReady;
				if (!connected) sendLinkCheckbox.checked = false;
				if (!connected) {
					connectionStatus.textContent = "● Disconnected";
					connectionStatus.style.color = colors.muted;
				} else if (peerCount) {
					connectionStatus.textContent = relayConnected ? "● Connected" : "● Connected · Signaling reconnecting…";
					connectionStatus.style.color = "#5cca8f";
				} else if (!roomReady) {
					connectionStatus.textContent = "● Connecting…";
					connectionStatus.style.color = colors.accentStrong;
				} else if (!relayConnected) {
					connectionStatus.textContent = "● Reconnecting…";
					connectionStatus.style.color = colors.accentStrong;
				} else {
					connectionStatus.textContent = "● Ready";
					connectionStatus.style.color = colors.label;
				}
				participantCount.textContent = connected && !roomReady ? "Searching for users" : connected ? String(peerCount + 1) + " user" + (peerCount ? "s" : "") : "0 users";
				if (sharepad.value !== padState.text) sharepad.value = padState.text;
				const ownStatus = localStream?.active ? " · Your " + (localStream.access === "public" ? "public" : "private") + " stream is active" : "";
				streamStatus.textContent = activeStreams.length + " active stream" + (activeStreams.length === 1 ? "" : "s") + ownStatus;
				startStream.disabled = !joined || Boolean(localStream?.active);
				stopStream.hidden = !localStream?.active;
				stopStream.disabled = !joined || !localStream?.active;
				renderLinks();
			}

			function joinRoom(roomId, updateUrl = false) {
				if (!ROOM_ID_PATTERN.test(roomId)) return setNotice("Room ID must use 1–49 ASCII letters or numbers.", true);
				leaveRoom(false);
				currentRoomId = roomId;
				roomFromUrl = updateUrl || roomFromUrl;
				if (updateUrl) {
					const nextUrl = new URL(location.href);
					nextUrl.searchParams.set("room", currentRoomId);
					history.replaceState(null, "", nextUrl);
				}
				const generation = connectionGeneration;
				try {
					connection = createRoomConnection(currentRoomId, {
						getState: () => ({pad: clonePadState(padState), streams: cloneStreamStates(), youtube: cloneYoutubeSharedState(youtubeState)}),
						onRelayStatus: ready => {
							if (generation !== connectionGeneration) return;
							relayConnected = ready;
							if (!ready || roomReady) return render();
							roomReady = true;
							publishProfile(true);
							for (const message of pendingOutgoingChatMessages.splice(0)) {
								connection.sendChat(message).catch(error => setNotice("Chat send failed: " + (error instanceof Error ? error.message : String(error)), true));
							}
							render();
						},
						onState: snapshot => {
							if (generation !== connectionGeneration) return;
							if (isValidPadState(snapshot?.pad) && !isIgnored(snapshot.pad.actor, "chatSharepad")) padState = clonePadState(snapshot.pad);
							if (Array.isArray(snapshot?.streams)) {
								for (const candidate of snapshot.streams) if (mergeStreamState(candidate) && !candidate.active) removeStreamOwner(candidate.ownerPeerId, candidate.sequence);
							}
							acceptYoutubeState(snapshot?.youtube, "", true);
							render();
						},
						onPad: candidate => {
							const newer = candidate?.version?.counter > padState.version.counter || (candidate?.version?.counter === padState.version.counter && candidate?.version?.peerId > padState.version.peerId);
							if (generation !== connectionGeneration || !isValidPadState(candidate) || !newer || isIgnored(candidate.actor, "chatSharepad")) return;
							padState = clonePadState(candidate);
							render();
						},
						onStream: (candidate, peerId) => {
							if (generation !== connectionGeneration || !mergeStreamState(candidate, peerId)) return;
							if (!candidate.active) removeStreamOwner(candidate.ownerPeerId, candidate.sequence);
							render();
						},
						onInvitation: (payload, peerId) => {
							if (generation === connectionGeneration) receiveInvitation(payload, peerId);
						},
						onInvitePolicy: (policy, peerId) => {
							if (generation !== connectionGeneration || typeof policy?.allowInvitations !== "boolean" || !isValidActor(policy.actor)) return;
							const actor = [...participants.values()].find(candidate => candidate.peerId === peerId);
							if (actor && actor.userId !== policy.actor.userId) return;
							invitePolicies.set(peerId, policy.allowInvitations);
							if (policy.allowInvitations) {
								const pending = pendingPolicyInvitations.get(peerId) || [];
								pendingPolicyInvitations.delete(peerId);
								for (const invitation of pending) connection.sendInvitation(invitation, [peerId]).catch(error => setNotice("Invitation failed: " + (error instanceof Error ? error.message : String(error)), true));
								resendOwnStreamInvitation(peerId, policy.actor);
							} else {
								pendingPolicyInvitations.delete(peerId);
							}
							renderParticipants();
							if (streamStartDialog.open) renderPrivateRecipients();
						},
						onChat: message => {
							if (generation !== connectionGeneration || isIgnored(message?.actor, "chatSharepad") || !USER_ID_PATTERN.test(message?.actor?.userId || "") || typeof message.actor?.name !== "string" || (message.actor?.mode !== "Web" && message.actor?.mode !== "VR") || typeof message?.text !== "string" || !Number.isSafeInteger(message?.timestamp)) return;
							if (message.actor.name.length > 40 || !message.text.trim() || message.text.length > CHAT_MESSAGE_MAX_LENGTH) return;
							if (message.actor.userId !== currentActor().userId) {
								participants.set(message.actor.userId, {...participants.get(message.actor.userId), ...message.actor, peerId: participants.get(message.actor.userId)?.peerId || ""});
								renderParticipants();
							}
							appendChatMessage(message);
						},
						onActivity: activity => {
							if (generation !== connectionGeneration || !isValidActivity(activity) || isIgnored(activity.actor, "streamLinks")) return;
							appendChatEvent(activityText(activity), activity.timestamp);
						},
						onYouTube: (message, peerId) => {
							if (generation === connectionGeneration) handleYoutubeMessage(message, peerId);
						},
						onProfile: (profile, peerId) => {
							const actor = normalizeProfile(profile, peerId);
							if (generation !== connectionGeneration || !actor || actor.userId === currentActor().userId) return;
							const isNewUser = !participants.has(actor.userId);
							participants.set(actor.userId, actor);
							renderParticipants();
							if (streamStartDialog.open) renderPrivateRecipients();
							sendInvitePolicy(actor);
							resendOwnStreamInvitation(peerId, actor);
							if (activeUserMenuActor?.userId === actor.userId) renderUserMenuHeader(actor);
							if (isNewUser && !isIgnored(actor, "chatSharepad")) appendChatEvent((actor.name || "Anonymous") + " joined.");
						},
						onPeerJoin: () => {
							if (generation === connectionGeneration && roomReady) publishProfile(true);
						},
						onPeerLeave: peerId => {
							if (generation !== connectionGeneration) return;
							const departedStream = streamStates.get(peerId);
							if (departedStream) streamStates.set(peerId, {...departedStream, sequence: departedStream.sequence + 1, active: false});
							if (departedStream?.active && !isIgnored(departedStream.actor, "streamLinks")) appendChatEvent(activityText({actor: departedStream.actor, kind: "stream", action: "stop", access: departedStream.access}));
							removeStreamOwner(peerId);
							invitePolicies.delete(peerId);
							pendingPolicyInvitations.delete(peerId);
							for (const [userId, actor] of participants) {
								if (actor.peerId !== peerId) continue;
								participants.delete(userId);
								if (!isIgnored(actor, "chatSharepad")) appendChatEvent((actor.name || "Anonymous") + " left.");
							}
							releaseYoutubePeer(peerId);
							renderParticipants();
							if (streamStartDialog.open) renderPrivateRecipients();
							render();
						},
						onPresence: count => {
							if (generation !== connectionGeneration) return;
							peerCount = count;
							render();
						},
						onJoinError: details => {
							if (generation !== connectionGeneration) return;
							const peerId = typeof details?.peerId === "string" ? details.peerId.slice(0, 8) : "unknown";
							const error = details?.error;
							setNotice("Peer " + peerId + " could not connect: " + (error instanceof Error ? error.message : String(error || "unknown error")), true);
						},
						onError: error => {
							if (generation === connectionGeneration) setNotice("Room synchronization failed: " + (error instanceof Error ? error.message : String(error)), true);
						}
					});
					render();
				} catch (error) {
					setNotice("Connection failed: " + (error instanceof Error ? error.message : String(error)), true, true);
				}
			}

			function startPublisher(access) {
				if (!connection || !roomReady || streamStates.get(selfId)?.active || (access !== "public" && access !== "hub")) return;
				const publicRoom = publicRoomInput.value;
				if (access === "public" && !ROOM_ID_PATTERN.test(publicRoom)) {
					publicRoomError.textContent = "Use 1–49 ASCII letters or numbers.";
					publicRoomError.hidden = false;
					publicRoomInput.setAttribute("aria-invalid", "true");
					publicRoomInput.focus();
					return;
				}
				const privateRecipients = access === "hub" ? selectedPrivateRecipients() : [];
				const popup = window.open("about:blank", "_blank");
				if (!popup) return setNotice("VDO.Ninja popup was blocked.", true);
				const streamId = access === "hub" ? [...crypto.getRandomValues(new Uint8Array(16))].map(value => value.toString(16).padStart(2, "0")).join("") : null;
				ownStreamDestination = access === "public" ? {room: publicRoom} : {id: streamId};
				ownStreamEveryone = access === "public";
				ownStreamInvitedUserIds.clear();
				for (const actor of privateRecipients) ownStreamInvitedUserIds.add(actor.userId);
				const state = updateOwnStreamState(true, access);
				addStreamInvitation(ownStreamInvitation(false), selfId, true);
				publisherWindow = popup;
				streamStartDialog.close();
				const publisherUrl = new URL(VDO_BASE_URL);
				if (access === "public") {
					publisherUrl.searchParams.set("room", publicRoom);
					publisherUrl.searchParams.set("push", "");
					publisherUrl.searchParams.set("screenshare", "");
				} else {
					publisherUrl.searchParams.set("push", streamId);
					publisherUrl.searchParams.set("quality", "0");
				}
				publisherUrl.searchParams.set("screensharequality", "0");
				publisherUrl.searchParams.set("outboundvideobitrate", "8000");
				publisherUrl.searchParams.set("maxvideobitrate", "8000");
				popup.document.title = "VDO.Ninja Publisher";
				popup.document.documentElement.style.cssText = "width:100%;height:100%;margin:0;background:#000";
				popup.document.body.style.cssText = "width:100%;height:100%;margin:0";
				const publisherFrame = popup.document.createElement("iframe");
				publisherFrame.title = "VDO.Ninja publisher";
				publisherFrame.allow = "camera; microphone; display-capture; autoplay; fullscreen; picture-in-picture";
				publisherFrame.style.cssText = "display:block;width:100%;height:100%;border:0";
				publisherFrame.src = publisherUrl.href;
				popup.document.body.appendChild(publisherFrame);
				popup.opener = null;
				publisherMonitor = setInterval(() => {
					const current = streamStates.get(selfId);
					if (publisherWindow?.closed && current?.active && current.sequence === state.sequence) stopStream.click();
				}, 1000);
				connection.sendStream(state).then(() => {
					const current = streamStates.get(selfId);
					if (current?.active && current.sequence === state.sequence) {
						announceStreamActivity("start", access);
						const payload = ownStreamInvitation(access === "hub");
						if (payload && access === "public") sendSelectedInvitation(payload, publicAudience, "Stream invitation");
						else if (payload && privateRecipients.length) connection.sendInvitation(payload, privateRecipients.map(actor => actor.peerId)).then(() => setNotice("Private stream invitations sent.")).catch(error => setNotice("Stream invitation failed: " + (error instanceof Error ? error.message : String(error)), true));
					}
				}).catch(error => {
					const current = streamStates.get(selfId);
					if (current?.active && current.sequence === state.sequence) {
						const stopped = updateOwnStreamState(false, access);
						removeStreamOwner(selfId, stopped.sequence);
						connection?.sendStream(stopped).catch(() => {});
					}
					closePublisher();
					setNotice("Stream start failed: " + (error instanceof Error ? error.message : String(error)), true);
				});
			}

				if (!connection || streamStates.get(selfId)?.active) return;
				publicRoomInput.value = currentRoomId;
				publicModeInput.checked = true;
				clearPublicRoomError();
				renderPrivateRecipients(true);
				renderStreamStartMode();
				streamStartDialog.showModal();
			});
			streamStartForm.addEventListener("submit", event => {
				event.preventDefault();
				startPublisher(privateModeInput.checked ? "hub" : "public");
			});
			publicModeInput.addEventListener("change", renderStreamStartMode);
			privateModeInput.addEventListener("change", renderStreamStartMode);
			privateSelectAll.addEventListener("change", () => {
				privateStreamAudience.userIds.clear();
				if (privateSelectAll.checked) {
					for (const actor of participants.values()) {
						if (actor.userId !== currentActor().userId && actor.peerId && invitePolicies.get(actor.peerId) === true) privateStreamAudience.userIds.add(actor.userId);
					}
				}
				renderPrivateRecipients();
			});
			publicRoomInput.addEventListener("input", () => {
				if (ROOM_ID_PATTERN.test(publicRoomInput.value)) clearPublicRoomError();
			});
			cancelStreamStart.addEventListener("click", () => streamStartDialog.close());

			stopStream.addEventListener("click", () => {
				const current = streamStates.get(selfId);
				if (!connection || !current?.active) return;
				const access = current.access;
				const state = updateOwnStreamState(false, access);
				removeStreamOwner(selfId, state.sequence);
				closePublisher();
				connection.sendStream(state).then(() => announceStreamActivity("stop", access)).catch(error => setNotice("Stream stop failed: " + (error instanceof Error ? error.message : String(error)), true));
				ownStreamDestination = null;
				ownStreamEveryone = false;
				ownStreamInvitedUserIds.clear();
			});

			window.addEventListener("beforeunload", () => {
				clearTimeout(padSendTimer);
				closePublisher();
				const current = streamStates.get(selfId);
				if (current?.active) connection?.sendStream(updateOwnStreamState(false, current.access)).catch(() => {});
				connection?.leave();
				clearInterval(youtubeMonitor);
				clearInterval(vdoStatusTimer);
			});

			readChatProfile();
			readCommunityAccess();
			readYoutubePersonalPlaylist();
			try { userRules = JSON.parse(localStorage.getItem(USER_RULES_KEY) || "{}") || {}; } catch { userRules = {}; }
			renderChatIdentity();
			render();
			if (roomFromUrl) joinRoom(currentRoomId);
		</script>
	</body>
</html>
